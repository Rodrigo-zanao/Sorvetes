<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monte seu Açaí</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#382b2b;background:linear-gradient(#fff8f188,#fff8f1aa),url('fundo.jpg') center/cover fixed;min-height:100vh}header{padding:22px 5%;background:#ffffffed;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px #0002}.brand{font-size:30px;font-weight:900;color:#e84c78;display:flex;align-items:center;gap:12px}.logo{height:62px;max-width:180px;object-fit:contain;border-radius:10px}.ticket-logo{display:block;max-width:150px;max-height:90px;object-fit:contain;margin:0 auto 14px}.back{font-size:17px;text-decoration:none;color:#392b2b;font-weight:bold}main{padding:30px 5% 120px}.hero{background:#ffffffdd;padding:26px;border-radius:24px;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#fff;border-radius:22px;padding:17px;box-shadow:0 6px 20px #0002}.pic{height:130px;border-radius:17px;background:#fff0e6;display:grid;place-items:center;font-size:64px}.card h2{margin:13px 0 5px}.desc{color:#756868;min-height:38px}.price{font-size:21px;font-weight:900;color:#e84c78}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.add{border:0;border-radius:50%;width:46px;height:46px;background:#392b2b;color:#fff;font-size:27px}.cart{position:fixed;bottom:0;left:0;right:0;background:#392b2b;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}.checkout{background:#f8c847;border:0;padding:14px 22px;border-radius:14px;font-weight:900;font-size:17px}.choice{min-height:310px;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:white;padding:28px;border-radius:28px;box-shadow:0 10px 30px #0003}.choice h2{font-size:36px;margin:0}.choice p{font-size:18px}.ice{background:linear-gradient(#0001,#0008),url('fundo.jpg') center/cover}.acai{background:linear-gradient(145deg,#54205fdd,#8b3a91dd)}.check{display:flex;gap:10px;align-items:center;background:#fff;padding:14px;border-radius:15px;font-weight:bold;cursor:pointer;border:2px solid transparent;transition:.15s}.check.selected{background:#7a3185;color:#fff;border-color:#55205e;box-shadow:0 4px 12px #54205f55}.check input{accent-color:#f8c847;transform:scale(1.25)}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.sizes{display:flex;gap:10px;flex-wrap:wrap}.size{padding:14px 18px;background:white;border:2px solid #eee;border-radius:15px;font-weight:bold}.size.active{border-color:#7a3185;background:#f3e5f5}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:30;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:white;width:min(520px,95vw);border-radius:24px;padding:26px;box-shadow:0 15px 50px #0005}.box h2{margin-top:0}.receipt{background:#fafafa;border:1px dashed #aaa;padding:18px;margin:15px 0;white-space:pre-line}.actions{display:flex;gap:10px}.actions button{flex:1;border:0;padding:15px;border-radius:14px;font-weight:bold;font-size:16px}.print{background:#f8c847}.cancel{background:#eee}@media print{body>*:not(.modal){display:none!important}.modal{position:static;display:block;background:white;padding:0}.box{box-shadow:none;width:100%;padding:0}.actions{display:none}}</style></head><body><header><a class="back" href="index.html">← Início</a><div class="brand"><img class="logo" src="logo.jpg" alt="Logo"> Açaí</div></header><main><section class="hero"><h1>Monte seu Açaí</h1><p>1. Escolha o tamanho</p><div class="sizes"><button class="size active" onclick="sel(this,16.9)">300 ml • R$ 16,90</button><button class="size" onclick="sel(this,22.9)">500 ml • R$ 22,90</button><button class="size" onclick="sel(this,28.9)">700 ml • R$ 28,90</button></div></section><section class="hero"><h1>2. Escolha os complementos</h1><p><b>2 complementos grátis.</b> A partir do 3º, R$ 3,00 por complemento adicional.</p><div class="checks" id="comps"></div></section></main><div class="cart"><div><b>Seu Açaí</b><br><span id="total">R$ 16,90</span> • <span id="count">0 complementos</span></div><button class="checkout" onclick="abrirPedido()">Adicionar ao pedido →</button></div><div class="modal" id="modal"><div class="box"><img class="ticket-logo" src="logo.jpg" alt="Logo"><h2>🧾 Confirmar pedido</h2><div class="receipt" id="recibo"></div><div class="actions"><button class="cancel" onclick="modal.classList.remove('open')">Voltar</button><button class="print" onclick="window.print()">🖨️ Imprimir pedido</button></div></div></div><script>let preco=16.9;const c=['Banana','Morango','Leite condensado','Leite em pó','Granola','Paçoca','Confete','Coco ralado','Calda de chocolate','Nutella'];c.forEach(x=>comps.insertAdjacentHTML('beforeend','<label class="check"><input type="checkbox" onchange="contar()"> '+x+'</label>'));function atualizar(){let n=document.querySelectorAll('input:checked').length,extras=Math.max(0,n-2),valor=preco+(extras*3);count.textContent=n+' complemento'+(n==1?'':'s')+(extras?' • '+extras+' adicional'+(extras==1?'':'is')+' (+ R$ '+(extras*3).toFixed(2).replace('.',',')+')':' • até 2 grátis');total.textContent='R$ '+valor.toFixed(2).replace('.',',')}function sel(b,p){document.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));b.classList.add('active');preco=p;atualizar()}function contar(){document.querySelectorAll('.check').forEach(x=>x.classList.toggle('selected',x.querySelector('input').checked));atualizar()};function abrirPedido(){let marcados=[...document.querySelectorAll('input:checked')].map(x=>x.parentElement.textContent.trim()),n=marcados.length,extras=Math.max(0,n-2),valor=preco+extras*3,sz=document.querySelector('.size.active').textContent.split('•')[0].trim();recibo.textContent='AÇAÍ '+sz+'\n------------------------\nComplementos:\n'+(marcados.length?marcados.map(x=>'• '+x).join('\n'):'Sem complementos')+'\n\nAdicionais pagos: '+extras+'\nTOTAL: R$ '+valor.toFixed(2).replace('.',',')+'\n\nObrigado pelo pedido!';modal.classList.add('open')}</script></body></html>
