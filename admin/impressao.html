<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Impressão</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f3f1;color:#302525}.top{background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{background:#fff;border-radius:18px;padding:18px;margin-bottom:15px}.status{font-weight:800;color:#15803d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.box{background:#fff;border-radius:16px;padding:15px}.pedido{border:1px solid #ddd;border-radius:12px;padding:11px;margin:8px 0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer;background:#6d28d9;color:white}.btn.gray{background:#eee;color:#333}.tag{font-size:12px;background:#dcfce7;color:#166534;padding:5px 9px;border-radius:999px}.cupom{display:none}.linha{margin:2px 0}.it{margin:5px 0}.det{font-size:12px}.erro{color:#b91c1c;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media print{body *{visibility:hidden}.cupom,.cupom *{visibility:visible}.cupom{display:block!important;position:absolute;left:0;top:0;width:76mm;padding:2mm;font-family:Arial,sans-serif;color:#000}.cupom h1{text-align:center;font-size:19px;margin:2px 0}.cupom .num{text-align:center;font-size:27px;font-weight:900;margin:7px 0}.cupom hr{border:0;border-top:1px dashed #000}.cupom .it{font-size:14px;font-weight:700}.cupom .det{font-size:12px}.cupom .fim{text-align:center;font-size:12px;margin-top:8px}@page{size:80mm auto;margin:2mm}}</style>
<script>const SB='https://eaqdwplkxuxtipxljutd.supabase.co',KEY='sb_publishable_UOjScs_n5p7yKN8HLRx_2A_hxxAjAid',STORE='sorvetes_admin_session';function sess(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}}async function guard(){let s=sess();if(!s?.access_token){location.replace('login.html');return null}let r=await fetch(SB+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}});if(!r.ok){location.replace('login.html');return null}return s}</script></head>
<body><div class="top"><b>🖨️ Central de Impressão</b><span class="tag">Automático • 3 segundos</span></div><main class="wrap"><div class="hero"><b>Bematech MP-4200</b><div id="st" class="status">Aguardando pedidos...</div><div style="margin-top:10px"><button class="btn gray" onclick="location.href='index.html'">← Admin</button> <button class="btn" onclick="carregar()">Atualizar</button></div><div id="err" class="erro"></div></div><div class="grid"><section class="box"><h3>⏳ Aguardando impressão</h3><div id="pend"></div></section><section class="box"><h3>✅ Últimos pedidos</h3><div id="ult"></div></section></div></main><div id="cupom" class="cupom"></div>
<script>
let ocupado=false,impressos=new Set(JSON.parse(localStorage.getItem('sorvetes_impressos')||'[]')),iniciado=false,marcoInicial=Number(localStorage.getItem('sorvetes_impressao_marco')||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function api(path){let r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+sess().access_token}});if(!r.ok)throw new Error(await r.text());return r.json()}
async function dadosPedido(p){let itens=await api('pedido_itens?select=id,nome,quantidade,categoria,observacao,talher,consumo&pedido_id=eq.'+p.id+'&order=id');let ids=itens.map(i=>i.id),sab=[],comp=[];if(ids.length){sab=await api('pedido_item_sabores?select=pedido_item_id,sabor_id,sabores(nome)&pedido_item_id=in.('+ids.join(',')+')');comp=await api('pedido_item_complementos?select=pedido_item_id,complemento_id,complementos(nome)&pedido_item_id=in.('+ids.join(',')+')')}return {itens,sab,comp}}
function agrupar(arr,getNome){let m={};arr.forEach(x=>{let n=getNome(x);if(n)m[n]=(m[n]||0)+1});return Object.entries(m).map(([n,q])=>q>1?n+' x'+q:n).join(', ')}
async function montar(p){let d=await dadosPedido(p);let h='<h1>SORVETES</h1><div class="num">PEDIDO '+esc(p.numero)+'</div><div style="text-align:center">'+new Date(p.data_hora).toLocaleString('pt-BR')+'</div><hr>';d.itens.forEach(i=>{h+='<div class="it">'+esc(i.quantidade||1)+'x '+esc(i.nome)+'</div>';let s=agrupar(d.sab.filter(x=>x.pedido_item_id===i.id),x=>x.sabores?.nome),c=agrupar(d.comp.filter(x=>x.pedido_item_id===i.id),x=>x.complementos?.nome);if(s)h+='<div class="det">Sabores: '+esc(s)+'</div>';if(c)h+='<div class="det">Complementos: '+esc(c)+'</div>';if(i.observacao)h+='<div class="det">Obs: '+esc(i.observacao)+'</div>';if(i.talher)h+='<div class="det">Talher: '+esc(i.talher)+'</div>';if(i.consumo)h+='<div class="det">'+esc(i.consumo)+'</div>';h+='<hr>'});h+='<div class="fim">Obrigado!</div>';return h}
async function imprimir(p,re=false){if(ocupado)return;ocupado=true;try{cupom.innerHTML=await montar(p);st.textContent='Imprimindo pedido '+p.numero+'...';await new Promise(r=>setTimeout(r,250));window.print();if(!re){impressos.add(p.id);marcoInicial=Math.max(marcoInicial,Number(p.id)||0);localStorage.setItem('sorvetes_impressos',JSON.stringify([...impressos].slice(-500)));localStorage.setItem('sorvetes_impressao_marco',String(marcoInicial))}st.textContent='Pedido '+p.numero+' enviado para impressão.'}catch(e){err.textContent=e.message}finally{ocupado=false;setTimeout(carregar,500)}}
async function carregar(){if(ocupado)return;try{let ps=await api('pedidos?select=id,numero,data_hora,status&order=id.desc&limit=50');if(!iniciado){let maior=ps.reduce((m,p)=>Math.max(m,Number(p.id)||0),0);if(!marcoInicial){marcoInicial=maior;localStorage.setItem('sorvetes_impressao_marco',String(marcoInicial))}iniciado=true}let nao=ps.filter(p=>Number(p.id)>marcoInicial&&!impressos.has(p.id)).reverse(),ultimos=ps.filter(p=>impressos.has(p.id)).slice(0,10);pend.innerHTML=nao.length?nao.map(p=>'<div class="pedido"><b>Pedido '+esc(p.numero)+'</b><br><small>'+new Date(p.data_hora).toLocaleString('pt-BR')+'</small></div>').join(''):'Nenhum pedido pendente.';ult.innerHTML=ultimos.length?ultimos.map(p=>'<div class="pedido"><b>Pedido '+esc(p.numero)+'</b> <button class="btn gray" style="float:right;padding:5px 8px" onclick=\'reimprimir('+JSON.stringify(p)+')\'>Reimprimir</button><br><small>'+new Date(p.data_hora).toLocaleString('pt-BR')+'</small></div>').join(''):'Nenhum pedido impresso nesta estação.';if(nao.length){await imprimir(nao[0])}else st.textContent='Aguardando novos pedidos...';err.textContent=''}catch(e){console.error(e);err.textContent='Erro: '+e.message}}
function reimprimir(p){imprimir(p,true)}
guard().then(s=>{if(s){carregar();setInterval(carregar,3000)}});window.onafterprint=()=>{st.textContent='Impressão concluída. Aguardando novos pedidos...'};
</script></body></html>
