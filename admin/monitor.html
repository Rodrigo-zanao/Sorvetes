<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor de Pedidos - Administração</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f4;color:#3d2b2b}.top{background:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 14px #0001;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:22px}.brand span{color:#7c3aed}.dev{font-size:10px;text-align:right;color:#766}.dev b{display:block;color:#7c3aed}.wrap{max-width:1500px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}.btn{border:0;border-radius:11px;padding:11px 15px;background:#6d28d9;color:#fff;font-weight:900;cursor:pointer}.btn.pause{background:#ef4444}.btn.play{background:#16a34a}.back{color:#6d28d9;text-decoration:none;font-weight:bold}.info{font-size:13px;color:#766}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #eadfea;border-radius:18px;overflow:hidden}.panel h2{margin:0;padding:16px 18px;background:#f7f0ff;font-size:20px}.panel.done h2{background:#ecfdf3}.scroll{overflow:auto;max-height:calc(100vh - 190px)}table{width:100%;border-collapse:collapse;min-width:590px}th,td{padding:11px 10px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}th{font-size:11px;text-transform:uppercase;color:#766;position:sticky;top:0;background:#fff;z-index:2}.num{font-weight:900;font-size:16px}.small{font-size:12px;color:#766}.valor{text-align:right;font-weight:900;white-space:nowrap}.statussel{padding:8px;border:1px solid #ddd;border-radius:9px;background:#fff;font-weight:bold}.save{border:0;border-radius:9px;padding:8px 10px;background:#6d28d9;color:#fff;font-weight:bold;cursor:pointer}.empty{padding:30px;text-align:center;color:#877}.badge{padding:7px 10px;border-radius:999px;background:#eee;font-size:12px;font-weight:bold}.paused{background:#fee2e2;color:#991b1b}.running{background:#dcfce7;color:#166534}@media(max-width:900px){.grid{grid-template-columns:1fr}.scroll{max-height:none}}</style>
<script>
const ADMIN_SB='https://eaqdwplkxuxtipxljutd.supabase.co',ADMIN_KEY='sb_publishable_UOjScs_n5p7yKN8HLRx_2A_hxxAjAid',ADMIN_STORE='sorvetes_admin_session';
function adminSession(){try{return JSON.parse(localStorage.getItem(ADMIN_STORE)||'null')}catch{return null}}
async function adminGuard(){const s=adminSession();if(!s?.access_token){location.replace('login.html');return null}const r=await fetch(ADMIN_SB+'/auth/v1/user',{headers:{apikey:ADMIN_KEY,Authorization:'Bearer '+s.access_token}});if(!r.ok){localStorage.removeItem(ADMIN_STORE);location.replace('login.html');return null}return s}
</script></head><body>
<div class="top"><div class="brand">🍦 Cardápio <span>Admin</span></div><div class="dev"><b>ADMIN 07 • MONITOR</b>DEV 25/09/2026 14:40</div></div>
<main class="wrap"><a class="back" href="index.html">← Painel</a>
<div class="toolbar"><button class="btn" onclick="carregar()">↻ Atualizar agora</button><button id="pauseBtn" class="btn pause" onclick="alternarPausa()">⏸ Pausar atualização</button><span id="modo" class="badge running">Atualização automática: 15 s</span><span id="ultima" class="info"></span></div>
<div class="grid">
<section class="panel"><h2>🧾 Em andamento <span id="nAbertos"></span></h2><div class="scroll"><table><thead><tr><th>Pedido</th><th>Hora</th><th>Situação</th><th>Total</th><th></th></tr></thead><tbody id="abertos"></tbody></table></div></section>
<section class="panel done"><h2>✓ Concluídos hoje <span id="nConcluidos"></span></h2><div class="scroll"><table><thead><tr><th>Pedido</th><th>Hora</th><th>Situação</th><th>Total</th><th></th></tr></thead><tbody id="concluidos"></tbody></table></div></section>
</div></main>
<script>
let pausado=false,timer=null;
const money=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function token(){return adminSession()?.access_token||''}
async function api(path,opt={}){opt.headers=Object.assign({apikey:ADMIN_KEY,Authorization:'Bearer '+token()},opt.headers||{});let r=await fetch(ADMIN_SB+'/rest/v1/'+path,opt);if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
function linha(p){let st=p.status||'NOVO';return '<tr><td><div class="num">#'+esc(p.numero)+'</div><div class="small">ID '+p.id+'</div></td><td>'+new Date(p.data_hora).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</td><td><select class="statussel" id="st'+p.id+'">'+['NOVO','PREPARANDO','PRONTO','ENTREGUE','CONCLUIDO'].map(x=>'<option '+(x===st?'selected':'')+'>'+x+'</option>').join('')+'</select></td><td class="valor">'+money(p.total)+'</td><td><button class="save" onclick="salvar('+p.id+')">Salvar</button></td></tr>'}
async function carregar(){
 try{
  let ps=await api('pedidos?select=id,numero,data_hora,status,total&order=id.asc&limit=300');
  let hoje=new Date();let y=hoje.getFullYear(),m=hoje.getMonth(),d=hoje.getDate();
  let doDia=p=>{let x=new Date(p.data_hora);return x.getFullYear()===y&&x.getMonth()===m&&x.getDate()===d};
  let a=ps.filter(p=>p.status!=='CONCLUIDO'), c=ps.filter(p=>p.status==='CONCLUIDO'&&doDia(p));
  abertos.innerHTML=a.length?a.map(linha).join(''):'<tr><td colspan="5" class="empty">Nenhum pedido em andamento.</td></tr>';
  concluidos.innerHTML=c.length?c.map(linha).join(''):'<tr><td colspan="5" class="empty">Nenhum pedido concluído hoje.</td></tr>';
  nAbertos.textContent='('+a.length+')';nConcluidos.textContent='('+c.length+')';
  ultima.textContent='Última atualização: '+new Date().toLocaleTimeString('pt-BR');
 }catch(e){ultima.textContent='Erro: '+e.message}
}
async function salvar(id){
 let novo=document.getElementById('st'+id).value;
 if(!confirm('Alterar o pedido para '+novo+'?'))return;
 try{await api('pedidos?id=eq.'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:novo})});await carregar()}catch(e){alert('Não foi possível alterar: '+e.message)}
}
function alternarPausa(){
 pausado=!pausado;
 pauseBtn.textContent=pausado?'▶ Retomar atualização':'⏸ Pausar atualização';
 pauseBtn.className='btn '+(pausado?'play':'pause');
 modo.textContent=pausado?'Atualização PAUSADA':'Atualização automática: 15 s';
 modo.className='badge '+(pausado?'paused':'running');
}
timer=setInterval(()=>{if(!pausado)carregar()},15000);
adminGuard().then(s=>{if(s)carregar()});
</script></body></html>
