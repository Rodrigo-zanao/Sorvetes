<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhe seu pedido</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f4;color:#352626}.top{text-align:center;background:#fff;padding:14px 20px;border-bottom:1px solid #eee}.logo{height:58px;max-width:180px;object-fit:contain}.top h1{margin:5px 0 0;font-size:28px}.wrap{max-width:1250px;margin:auto;padding:18px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{background:#fff;border-radius:18px;padding:15px;border:1px solid #eadfea}.box h2{margin:0 0 12px;font-size:20px;text-align:center}.box.prep h2{color:#15803d}.box.done h2{color:#1d4ed8}.lista{display:grid;gap:8px}.pedido{border-radius:12px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;min-height:48px}.prep .pedido{background:#dcfce7;border:1px solid #86efac;color:#14532d}.done .pedido{background:#dbeafe;border:1px solid #93c5fd;color:#1e3a8a}.numero{font-size:19px;font-weight:900}.hora{font-size:11px;opacity:.75;margin-top:2px}.estado{font-size:12px;font-weight:900;text-transform:uppercase}.vazio{text-align:center;color:#887;padding:22px 8px}.erro{text-align:center;color:#991b1b;padding:10px}@media(max-width:700px){.cols{grid-template-columns:1fr}.logo{height:48px}.top h1{font-size:23px}.pedido{min-height:44px}.numero{font-size:17px}}</style>
<script>const ADMIN_SB='https://eaqdwplkxuxtipxljutd.supabase.co',ADMIN_KEY='sb_publishable_UOjScs_n5p7yKN8HLRx_2A_hxxAjAid',ADMIN_STORE='sorvetes_admin_session';function sess(){try{return JSON.parse(localStorage.getItem(ADMIN_STORE)||'null')}catch{return null}}async function guard(){let s=sess();if(!s?.access_token){location.replace('login.html');return null}let r=await fetch(ADMIN_SB+'/auth/v1/user',{headers:{apikey:ADMIN_KEY,Authorization:'Bearer '+s.access_token}});if(!r.ok){location.replace('login.html');return null}return s}</script></head>
<body><header class="top"><img class="logo" src="../logo.jpg" alt="Logo"><h1>Acompanhe seu pedido</h1></header><main class="wrap"><div class="cols"><section class="box prep"><h2>🟢 Em produção</h2><div id="preparando" class="lista"></div></section><section class="box done"><h2>🔵 Produzidos / Concluídos</h2><div id="concluidos" class="lista"></div></section></div><div id="erro" class="erro"></div></main>
<script>
const SB=ADMIN_SB,KEY=ADMIN_KEY;let anteriores=null,audioLiberado=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function api(path){let r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+sess().access_token}});if(!r.ok)throw new Error(await r.text());return r.json()}
function beep(){try{let A=window.AudioContext||window.webkitAudioContext,ctx=new A(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.setValueAtTime(.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);o.start();o.stop(ctx.currentTime+.35)}catch(e){}}
function card(p,label){return '<div class="pedido"><div><div class="numero">Pedido '+esc(p.numero)+'</div><div class="hora">'+new Date(p.data_hora).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div></div><div class="estado">'+label+'</div></div>'}
async function carregar(){try{let ativos=await api('pedidos?select=id,numero,data_hora,status&status=in.(PREPARANDO,PRONTO)&order=id.asc&limit=100'),fim=await api('pedidos?select=id,numero,data_hora,status&status=in.(ENTREGUE,CONCLUIDO)&order=id.desc&limit=5');preparando.innerHTML=ativos.length?ativos.map(p=>card(p,p.status==='PRONTO'?'PRONTO':'PREPARANDO')).join(''):'<div class="vazio">Nenhum pedido em produção.</div>';concluidos.innerHTML=fim.length?fim.map(p=>card(p,'PRONTO')).join(''):'<div class="vazio">Nenhum pedido concluído.</div>';let ids=fim.map(x=>x.id);if(anteriores!==null&&ids.some(id=>!anteriores.includes(id)))beep();anteriores=ids;erro.textContent=''}catch(e){console.error(e);erro.textContent='Não foi possível atualizar os pedidos.'}}
let busy=false;async function auto(){if(busy)return;busy=true;try{await carregar()}finally{busy=false}}guard().then(s=>{if(s){auto();setInterval(auto,5000)}});
document.addEventListener('click',()=>{if(!audioLiberado){audioLiberado=true;beep()}},{once:true});
</script></body></html>
