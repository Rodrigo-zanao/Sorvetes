<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produção - Administração</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f4;color:#3d2b2b}.top{background:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 14px #0001;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:22px}.brand span{color:#7c3aed}.dev{font-size:11px;text-align:right;color:#766}.dev b{display:block;color:#7c3aed}.wrap{max-width:1450px;margin:auto;padding:28px 18px}.hero{background:linear-gradient(135deg,#6d28d9,#a855f7);color:#fff;border-radius:24px;padding:28px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:30px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}.card{color:#3d2b2b;background:#fff;border:1px solid #eadfea;border-radius:20px;padding:18px;box-shadow:0 8px 25px #0000000c;transition:.15s}.card[data-status='NOVO']{border-top:5px solid #f59e0b}.card[data-status='PREPARANDO']{border-top:5px solid #7c3aed}.card[data-status='PRONTO']{border-top:5px solid #22c55e}.item{padding:10px 0;border-bottom:1px dashed #eee}.item small{display:block;color:#766;margin-top:4px}.head{display:flex;justify-content:space-between;gap:10px}.numero{font-size:20px;font-weight:900}.acoes{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn.green{background:#16a34a}.btn.blue{background:#2563eb}.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px #0002}.ico{font-size:34px}.card h2{margin:10px 0 5px}.muted{color:#7b7070}.tag{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#f3e8ff;color:#6d28d9;font-size:12px;font-weight:bold}.back{color:#6d28d9;text-decoration:none;font-weight:bold}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:12px;padding:11px 16px;background:#6d28d9;color:#fff;font-weight:bold;cursor:pointer}.btn.secondary{background:#eee;color:#433}.panel{background:#fff;border:1px solid #eadfea;border-radius:18px;padding:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee}th{font-size:12px;color:#766;text-transform:uppercase}input{padding:8px;border:1px solid #ddd;border-radius:8px;max-width:100px}.status{padding:12px;border-radius:12px;background:#f5f5f5;margin-bottom:14px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.brand{font-size:18px}.hero h1{font-size:25px}.dev{font-size:9px}}</style><script>
const ADMIN_SB='https://eaqdwplkxuxtipxljutd.supabase.co',ADMIN_KEY='sb_publishable_UOjScs_n5p7yKN8HLRx_2A_hxxAjAid',ADMIN_STORE='sorvetes_admin_session';
function adminSession(){try{return JSON.parse(localStorage.getItem(ADMIN_STORE)||'null')}catch{return null}}
async function adminGuard(){const s=adminSession();if(!s?.access_token){location.replace('login.html');return null}const r=await fetch(ADMIN_SB+'/auth/v1/user',{headers:{apikey:ADMIN_KEY,Authorization:'Bearer '+s.access_token}});if(!r.ok){localStorage.removeItem(ADMIN_STORE);location.replace('login.html');return null}return s}
async function sairAdmin(){const s=adminSession();if(s?.access_token)await fetch(ADMIN_SB+'/auth/v1/logout',{method:'POST',headers:{apikey:ADMIN_KEY,Authorization:'Bearer '+s.access_token}}).catch(()=>{});localStorage.removeItem(ADMIN_STORE);location.replace('login.html')}
</script></head><body><div class="top"><div class="brand">🍦 Cardápio <span>Admin</span></div><div class="dev"><b>ADMIN 05 • PRODUÇÃO</b>DEV 25/09/2026 21:30</div></div><main class="wrap"><a class="back" href="index.html">← Painel</a><section class="hero" style="margin-top:18px"><h1>👨‍🍳 Produção</h1><p>Fila operacional para preparação e entrega.</p></section><div class="toolbar"><button class="btn" onclick="carregar()">↻ Atualizar agora</button><span class="tag">🔄 Automático: 10 segundos</span></div><div id="status" class="status">Carregando...</div><div id="fila" class="grid"></div></main><script>
const SB=ADMIN_SB,KEY=ADMIN_KEY,esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function api(path){let r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+adminSession().access_token}});if(!r.ok)throw new Error(await r.text());return r.json()}
async function carregar(){try{let ps=await api('pedidos?select=id,numero,data_hora,status&status=in.(NOVO,PREPARANDO,PRONTO)&order=id.asc&limit=100');if(!ps.length){status.textContent='Nenhum pedido na fila.';fila.innerHTML='<div class="panel">Produção em dia. Nenhum pedido aguardando.</div>';return}let ids=ps.map(x=>x.id).join(','),it=await api('pedido_itens?select=pedido_id,categoria,nome,quantidade,talher,consumo,observacao&pedido_id=in.('+ids+')&order=id');status.textContent=ps.length+' pedido(s) na produção.';fila.innerHTML=ps.map(p=>'<article class="card" data-status="'+esc(p.status)+'"><div class="head"><div><div class="numero">PEDIDO Nº '+esc(p.numero)+'</div><small>'+new Date(p.data_hora).toLocaleString('pt-BR')+'</small></div><span class="tag">'+esc(p.status)+'</span></div>'+it.filter(i=>i.pedido_id===p.id).map(i=>'<div class="item"><b>'+esc(i.quantidade||1)+'x '+esc(i.nome)+'</b><small>'+esc(i.categoria)+(i.observacao?'<br>'+esc(i.observacao):'')+(i.talher?'<br>Talher: '+esc(i.talher):'')+(i.consumo?' • '+esc(i.consumo):'')+'</small></div>').join('')+'<div class="acoes">'+(p.status==='NOVO'?'<button class="btn" onclick="mudar('+p.id+',\'PREPARANDO\')">👨‍🍳 Preparar</button>':'')+(p.status==='PREPARANDO'?'<button class="btn green" onclick="mudar('+p.id+',\'PRONTO\')">✓ Pronto</button>':'')+(p.status==='PRONTO'?'<button class="btn blue" onclick="mudar('+p.id+',\'ENTREGUE\')">📦 Entregue</button>':'')+'</div></article>').join('')}catch(e){console.error(e);status.textContent='Erro ao carregar produção: '+e.message}}
async function mudar(id,novo){let r=await fetch(SB+'/rest/v1/pedidos?id=eq.'+id,{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+adminSession().access_token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:novo})});if(!r.ok){alert('Erro ao alterar status: '+await r.text());return}carregar()}
let busy=false;async function auto(){if(busy)return;busy=true;try{await carregar()}finally{busy=false}}adminGuard().then(s=>{if(s){auto();setInterval(auto,10000)}});
</script></body></html>
