<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos - Administração</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f4;color:#3d2b2b}.top{background:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 14px #0001;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:22px}.brand span{color:#7c3aed}.dev{font-size:11px;text-align:right;color:#766}.dev b{display:block;color:#7c3aed}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.hero{background:linear-gradient(135deg,#6d28d9,#a855f7);color:#fff;border-radius:24px;padding:28px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{display:block;text-decoration:none;color:#3d2b2b;background:#fff;border:1px solid #eadfea;border-radius:20px;padding:22px;box-shadow:0 8px 25px #0000000c;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px #0002}.ico{font-size:34px}.card h2{margin:10px 0 5px}.muted{color:#7b7070}.tag{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#f3e8ff;color:#6d28d9;font-size:12px;font-weight:bold}.back{color:#6d28d9;text-decoration:none;font-weight:bold}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:12px;padding:11px 16px;background:#6d28d9;color:#fff;font-weight:bold;cursor:pointer}.btn.secondary{background:#eee;color:#433}.panel{background:#fff;border:1px solid #eadfea;border-radius:18px;padding:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee}th{font-size:12px;color:#766;text-transform:uppercase}input{padding:8px;border:1px solid #ddd;border-radius:8px;max-width:100px}.status{padding:12px;border-radius:12px;background:#f5f5f5;margin-bottom:14px}@media(max-width:600px){.brand{font-size:18px}.hero h1{font-size:25px}.dev{font-size:9px}}</style></head><body><div class="top"><div class="brand">🍦 Cardápio <span>Admin</span></div><div class="dev"><b>ADMIN 02 • PRODUTOS</b>DEV 24/09/2026 22:43</div></div><main class="wrap"><a class="back" href="index.html">← Painel</a><section class="hero" style="margin-top:18px"><h1>Produtos e preços</h1><p>Consulta direta do Supabase. Alterações continuam bloqueadas pela segurança RLS.</p></section><div id="status" class="status">Carregando produtos...</div><div class="panel"><table><thead><tr><th>Código</th><th>Categoria</th><th>Produto</th><th>Preço</th><th>Ativo</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
const SB='https://eaqdwplkxuxtipxljutd.supabase.co', KEY='sb_publishable_UOjScs_n5p7yKN8HLRx_2A_hxxAjAid';
async function carregar(){
 const st=document.getElementById('status'), tb=document.getElementById('rows');
 try{
  const [catsRes,prodRes]=await Promise.all([
   fetch(SB+'/rest/v1/categorias?select=id,nome&order=ordem',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}),
   fetch(SB+'/rest/v1/produtos?select=id,categoria_id,codigo,nome,preco,ativo,ordem&order=categoria_id,ordem',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}})
  ]);
  if(!catsRes.ok||!prodRes.ok) throw new Error('Falha ao consultar Supabase');
  const cats=await catsRes.json(), ps=await prodRes.json(), mapa=Object.fromEntries(cats.map(x=>[x.id,x.nome]));
  tb.innerHTML=ps.map(p=>'<tr><td>'+p.codigo+'</td><td>'+(mapa[p.categoria_id]||'')+'</td><td><b>'+p.nome+'</b></td><td>R$ '+Number(p.preco).toFixed(2).replace('.',',')+'</td><td>'+(p.ativo?'Sim':'Não')+'</td></tr>').join('');
  st.textContent='✓ '+ps.length+' produtos carregados diretamente do Supabase.';
 }catch(e){st.textContent='⚠ Não foi possível carregar os produtos: '+e.message}
}
carregar();
</script></body></html>
