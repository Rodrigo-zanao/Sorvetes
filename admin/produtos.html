<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos - Administração</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f4;color:#3d2b2b}.top{background:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 14px #0001;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:22px}.brand span{color:#7c3aed}.dev{font-size:11px;text-align:right;color:#766}.dev b{display:block;color:#7c3aed}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.hero{background:linear-gradient(135deg,#6d28d9,#a855f7);color:#fff;border-radius:24px;padding:28px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{display:block;text-decoration:none;color:#3d2b2b;background:#fff;border:1px solid #eadfea;border-radius:20px;padding:22px;box-shadow:0 8px 25px #0000000c;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px #0002}.ico{font-size:34px}.card h2{margin:10px 0 5px}.muted{color:#7b7070}.tag{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#f3e8ff;color:#6d28d9;font-size:12px;font-weight:bold}.back{color:#6d28d9;text-decoration:none;font-weight:bold}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:12px;padding:11px 16px;background:#6d28d9;color:#fff;font-weight:bold;cursor:pointer}.btn.secondary{background:#eee;color:#433}.panel{background:#fff;border:1px solid #eadfea;border-radius:18px;padding:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee}th{font-size:12px;color:#766;text-transform:uppercase}input{padding:8px;border:1px solid #ddd;border-radius:8px;max-width:100px}.status{padding:12px;border-radius:12px;background:#f5f5f5;margin-bottom:14px}@media(max-width:600px){.brand{font-size:18px}.hero h1{font-size:25px}.dev{font-size:9px}}</style><script>
const ADMIN_SB='https://eaqdwplkxuxtipxljutd.supabase.co',ADMIN_KEY='sb_publishable_UOjScs_n5p7yKN8HLRx_2A_hxxAjAid',ADMIN_STORE='sorvetes_admin_session';
function adminSession(){try{return JSON.parse(localStorage.getItem(ADMIN_STORE)||'null')}catch{return null}}
async function adminGuard(){const s=adminSession();if(!s?.access_token){location.replace('login.html');return null}const r=await fetch(ADMIN_SB+'/auth/v1/user',{headers:{apikey:ADMIN_KEY,Authorization:'Bearer '+s.access_token}});if(!r.ok){localStorage.removeItem(ADMIN_STORE);location.replace('login.html');return null}return s}
async function sairAdmin(){const s=adminSession();if(s?.access_token)await fetch(ADMIN_SB+'/auth/v1/logout',{method:'POST',headers:{apikey:ADMIN_KEY,Authorization:'Bearer '+s.access_token}}).catch(()=>{});localStorage.removeItem(ADMIN_STORE);location.replace('login.html')}
</script></head><body><div class="top"><div class="brand">🍦 Cardápio <span>Admin</span></div><div class="dev"><b>ADMIN 02 • PRODUTOS</b>DEV 26/09/2026 23:20</div></div><main class="wrap"><a class="back" href="index.html">← Painel</a>
<section class="hero" style="margin-top:18px"><h1>Cadastro do cardápio</h1><p>Agora o cardápio é controlado diretamente pelo Supabase.</p></section>
<div id="status" class="status">Carregando...</div>
<div class="toolbar"><button class="btn" onclick="aba('produtos')">🍦 Produtos</button><button class="btn" onclick="aba('categorias')">📁 Categorias</button><button class="btn" onclick="aba('sabores')">🎨 Sabores</button><button class="btn" onclick="aba('complementos')">➕ Complementos</button><button class="btn" onclick="abrirRegras()">⚙️ Regras de Complementos</button><button class="btn secondary" onclick="carregarTudo()">↻ Atualizar</button></div>
<div id="editor" class="panel" style="display:none;margin-bottom:16px"></div>
<div class="panel"><h2 id="tituloLista">Produtos</h2><div id="lista"></div></div></main>
<script>
const SB='https://eaqdwplkxuxtipxljutd.supabase.co',KEY='sb_publishable_UOjScs_n5p7yKN8HLRx_2A_hxxAjAid';let dados={},atual='produtos';
function H(){return {apikey:KEY,Authorization:'Bearer '+adminSession().access_token,'Content-Type':'application/json',Prefer:'return=representation'}}
async function api(path,opt={}){let r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{...H(),...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());let t=await r.text();return t?JSON.parse(t):[]}
async function carregarTudo(){try{let [c,p,s,o]=await Promise.all([api('categorias?select=*&order=ordem'),api('produtos?select=*&order=categoria_id,ordem'),api('sabores?select=*&order=ordem'),api('complementos?select=*&order=ordem')]);dados={categorias:c,produtos:p,sabores:s,complementos:o};status.textContent='✓ '+c.length+' categorias • '+p.length+' produtos • '+s.length+' sabores • '+o.length+' complementos';render()}catch(e){status.textContent='⚠ '+e.message}}
function aba(x){atual=x;editor.style.display='none';render()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){tituloLista.textContent=atual[0].toUpperCase()+atual.slice(1);let a=dados[atual]||[],cat=Object.fromEntries((dados.categorias||[]).map(x=>[x.id,x.nome]));let cols=atual==='produtos'?['Código','Categoria','Nome','Preço','Sabores','Grátis','Ativo']:atual==='categorias'?['Código','Nome','Ícone','Ativo']:atual==='complementos'?['Código','Categoria','Nome','Preço','Limite grátis','Valor adicional','Ativo']:['Código','Nome','Ativo'];lista.innerHTML='<div class="toolbar"><button class="btn" onclick="novo()">＋ Novo</button></div><table><thead><tr>'+cols.map(x=>'<th>'+x+'</th>').join('')+'<th>Ações</th></tr></thead><tbody>'+a.map(x=>'<tr>'+linha(x,cat)+'<td><button class="btn secondary" onclick="editar('+x.id+')">✏️</button> <button class="btn secondary" onclick="toggle('+x.id+','+!!x.ativo+')">'+(x.ativo?'⛔':'✓')+'</button></td></tr>').join('')+'</tbody></table>'}
function linha(x,cat){if(atual==='produtos')return '<td>'+esc(x.codigo)+'</td><td>'+esc(cat[x.categoria_id])+'</td><td><b>'+esc(x.nome)+'</b></td><td>R$ '+Number(x.preco||0).toFixed(2).replace('.',',')+'</td><td>'+Number(x.qtd_sabores||1)+'</td><td>'+Number(x.qtd_complementos_gratis||0)+'</td><td>'+(x.ativo?'Sim':'Não')+'</td>';if(atual==='categorias')return '<td>'+esc(x.codigo)+'</td><td><b>'+esc(x.nome)+'</b></td><td>'+esc(x.icone)+'</td><td>'+(x.ativo?'Sim':'Não')+'</td>';if(atual==='complementos')return '<td>'+esc(x.codigo)+'</td><td>'+esc(cat[x.categoria_id])+'</td><td><b>'+esc(x.nome)+'</b></td><td>'+(x.preco==null?'Regra padrão':'R$ '+Number(x.preco).toFixed(2).replace('.',','))+'</td><td>'+(Number(x.limite_por_copo||0)===0?'Ilimitado':Number(x.limite_por_copo))+'</td><td>'+(x.valor_adicional==null?'Regra padrão':'R$ '+Number(x.valor_adicional).toFixed(2).replace('.',','))+'</td><td>'+(x.ativo?'Sim':'Não')+'</td>';return '<td>'+esc(x.codigo)+'</td><td><b>'+esc(x.nome)+'</b></td><td>'+(x.ativo?'Sim':'Não')+'</td>'}
function proximoCodigo(){let pref={produtos:'PRO',categorias:'CAT',sabores:'SOR',complementos:'COM'}[atual]||'CAD';if(atual==='produtos'){let sel=(dados.categorias||[])[0],map={SORVETES:'PRO',PICOLES:'PIC',ITALIANINHA:'ITA',BARCAS:'BAR',CREPES:'CRE',BEBIDAS:'BEB',DIVERSOS:'DIV'};pref=map[sel?.codigo]||'PRO'}let nums=(dados[atual]||[]).map(x=>{let m=String(x.codigo||'').match(/(\d+)$/);return m?Number(m[1]):0});return pref+String(Math.max(0,...nums)+1).padStart(3,'0')}
function novo(){form({ativo:true,ordem:(dados[atual]||[]).length+1,codigo:proximoCodigo()})}function editar(id){form((dados[atual]||[]).find(x=>x.id===id)||{})}
function form(x){let cats=(dados.categorias||[]).map(c=>'<option value="'+c.id+'" '+(c.id==x.categoria_id?'selected':'')+'>'+esc(c.nome)+'</option>').join('');let campos='<input type="hidden" id="eid" value="'+(x.id||'')+'"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"><label>Código<br><input id="ecodigo" value="'+esc(x.codigo||'')+'" readonly style="width:100%;max-width:none;background:#f2f2f2;color:#777"><small style="color:#777">Gerado automaticamente</small></label><label>Nome<br><input id="enome" value="'+esc(x.nome||'')+'" style="width:100%;max-width:none"></label>';if(atual==='produtos'||atual==='complementos')campos+='<label>Categoria<br><select onchange="if(!eid.value&&atual===\'produtos\'){let op=dados.categorias.find(x=>x.id==this.value),map={SORVETES:\'PRO\',PICOLES:\'PIC\',ITALIANINHA:\'ITA\',BARCAS:\'BAR\',CREPES:\'CRE\',BEBIDAS:\'BEB\',DIVERSOS:\'DIV\'},pref=map[op?.codigo]||\'PRO\',nums=dados.produtos.filter(x=>x.categoria_id==this.value).map(x=>{let m=String(x.codigo||\'\').match(/(\\d+)$/);return m?Number(m[1]):0});ecodigo.value=pref+String(Math.max(0,...nums)+1).padStart(3,\'0\')}" id="ecategoria" style="width:100%;padding:9px">'+cats+'</select></label><label>Preço'+(atual==='complementos'?' (vazio = regra padrão)':'')+'<br><input id="epreco" type="number" step=".01" value="'+(x.preco??'')+'" style="width:100%;max-width:none"></label>';if(atual==='produtos')campos+='<label>Qtd. sabores/bolas<br><input id="eqtd" type="number" min="1" value="'+(x.qtd_sabores||1)+'" style="width:100%;max-width:none"></label><label>Complementos grátis<br><input id="egratis" type="number" min="0" value="'+(x.qtd_complementos_gratis||0)+'" style="width:100%;max-width:none"></label><label style="display:flex;align-items:center;gap:8px;margin-top:22px"><input id="epermite" type="checkbox" '+(x.permite_complementos?'checked':'')+'> Permite complementos</label>';if(atual==='complementos')campos+='<label>Limite gratuito<br><input id="elimite" type="number" min="0" value="'+(x.limite_por_copo||0)+'" style="width:100%;max-width:none"><small>0 = ilimitado</small></label><label>Valor de cada adicional<br><input id="evaloradicional" type="number" min="0" step=".01" value="'+(x.valor_adicional??'')+'" style="width:100%;max-width:none"><small>Vazio = valor extra padrão</small></label>';if(atual==='categorias')campos+='<label>Ícone<br><input id="eicone" value="'+esc(x.icone||'')+'" style="width:100%;max-width:none"></label><label>Slug<br><input id="eslug" value="'+esc(x.slug||'')+'" style="width:100%;max-width:none"></label>';campos+='<label>Ordem<br><input id="eordem" type="number" value="'+(x.ordem||0)+'" style="width:100%;max-width:none"></label></div><div class="toolbar"><button class="btn" onclick="salvar()">💾 Salvar</button><button class="btn secondary" onclick="editor.style.display=\'none\'">Cancelar</button></div>';editor.innerHTML='<h2>'+(x.id?'Editar ':'Novo ')+atual.slice(0,-1)+'</h2>'+campos;editor.style.display='block';editor.scrollIntoView({behavior:'smooth'})}
async function salvar(){try{let id=eid.value,b={codigo:ecodigo.value.trim(),nome:enome.value.trim(),ordem:Number(eordem.value||0)};if(!b.codigo||!b.nome)return alert('Informe código e nome.');if(atual==='produtos'||atual==='complementos'){b.categoria_id=Number(ecategoria.value);b.preco=epreco.value===''?null:Number(epreco.value)}if(atual==='produtos'){b.qtd_sabores=Math.max(1,Number(eqtd.value||1));b.qtd_complementos_gratis=Math.max(0,Number(egratis.value||0));b.permite_complementos=epermite.checked;if(b.preco==null)b.preco=0}if(atual==='complementos'){b.limite_por_copo=Math.max(0,Number(elimite.value||0));b.valor_adicional=evaloradicional.value===''?null:Math.max(0,Number(evaloradicional.value||0))}if(atual==='categorias'){b.icone=eicone.value.trim();b.slug=eslug.value.trim()||b.codigo.toLowerCase()}if(!id)b.ativo=true;await api(atual+(id?'?id=eq.'+id:''),{method:id?'PATCH':'POST',body:JSON.stringify(b)});editor.style.display='none';await carregarTudo()}catch(e){alert('Erro ao salvar: '+e.message)}}
async function abrirRegras(){try{let a=await api('configuracoes?chave=in.(complementos_gratis_copo,valor_complemento_extra)&select=chave,valor');let m=Object.fromEntries(a.map(x=>[x.chave,x.valor]));editor.innerHTML='<h2>⚙️ Regras de Complementos</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px"><label>Complementos grátis padrão<br><input id="rgratis" type="number" min="0" step="1" value="'+esc(m.complementos_gratis_copo??4)+'" style="width:100%;max-width:none"></label><label>Valor do complemento extra<br><input id="rextra" type="number" min="0" step=".01" value="'+esc(m.valor_complemento_extra??4)+'" style="width:100%;max-width:none"></label></div><p class="muted">Cada produto pode ter sua própria quantidade de complementos grátis. Complementos com preço próprio sempre usam o preço cadastrado.</p><div class="toolbar"><button class="btn" onclick="salvarRegras()">💾 Salvar regras</button><button class="btn secondary" onclick="editor.style.display=\'none\'">Cancelar</button></div>';editor.style.display='block';editor.scrollIntoView({behavior:'smooth'})}catch(e){alert('Erro ao carregar regras: '+e.message)}}
async function salvarRegras(){try{let g=Math.max(0,Number(rgratis.value||0)),v=Math.max(0,Number(rextra.value||0));await api('configuracoes?chave=eq.complementos_gratis_copo',{method:'PATCH',body:JSON.stringify({valor:String(g)})});await api('configuracoes?chave=eq.valor_complemento_extra',{method:'PATCH',body:JSON.stringify({valor:v.toFixed(2)})});alert('Regras salvas.');editor.style.display='none'}catch(e){alert('Erro ao salvar regras: '+e.message)}}
async function toggle(id,v){try{await api(atual+'?id=eq.'+id,{method:'PATCH',body:JSON.stringify({ativo:!v})});await carregarTudo()}catch(e){alert('Erro: '+e.message)}}
adminGuard().then(s=>{if(s)carregarTudo()});
</script></body></html>
