<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bebidas</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#382b2b;background:linear-gradient(#fff8f188,#fff8f1aa),url('fundo.jpg') center/cover fixed;min-height:100vh}header{padding:22px 5%;background:#ffffffed;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px #0002}.brand{font-size:30px;font-weight:900;color:#2980b9;display:flex;align-items:center;gap:12px}.logo{height:62px;max-width:180px;object-fit:contain;border-radius:10px}main{padding:30px 5% 120px}.page-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}.hero,.sidecart{background:#ffffffee;border-radius:22px;padding:22px;box-shadow:0 8px 25px #0002}.hero h1{margin:0 0 8px;font-size:34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}.drink{background:#fff;border:2px solid #e7eef2;border-radius:16px;padding:15px;text-align:left;cursor:pointer;min-height:95px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}.drink:hover{border-color:#2980b9;transform:translateY(-1px)}.drink b{font-size:17px}.drink span{font-size:18px;font-weight:900;color:#2980b9;margin-top:9px}.sidecart{position:sticky;top:115px;max-height:calc(100vh - 210px);overflow:auto}.sidecart h2{margin:0 0 12px;color:#7a3185}.sideitem{background:#f8f1f9;border:1px solid #eadcec;border-radius:14px;padding:12px;margin-bottom:10px}.sideitem-top{display:flex;justify-content:space-between;gap:8px;font-weight:900}.sideitem small{display:block;color:#756879;margin-top:5px}.sideitem button{border:0;background:#f3dddd;color:#8b3030;border-radius:8px;padding:6px 8px;margin-top:7px;font-weight:bold}.sideempty{color:#877989;padding:18px 4px;text-align:center}.sidetotal{border-top:2px solid #eadcec;margin-top:12px;padding-top:12px;font-size:19px;font-weight:900}.topnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 auto}.topnav a{text-decoration:none;color:#49383a;background:#fff;border:2px solid #eee;padding:10px 14px;border-radius:12px;font-weight:800}.topnav a.active{background:#392b2b;color:#fff;border-color:#392b2b}.clear-order-btn{border:0;background:#b83b3b;color:#fff;padding:10px 13px;border-radius:11px;font-weight:900;cursor:pointer}.global-order-float{position:fixed;right:20px;bottom:20px;z-index:25;border:0;border-radius:18px;padding:13px 17px;background:#392b2b;color:#fff;font-weight:900;font-size:15px;box-shadow:0 5px 18px #0004}.global-order-float span{display:block;font-size:13px;margin-top:3px;color:#f8c847}.toast-added{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);z-index:1000;background:#fff;color:#382b2b;border-radius:22px;padding:24px 30px;min-width:280px;text-align:center;box-shadow:0 18px 60px #0005;opacity:0;pointer-events:none;transition:.22s}.toast-added.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast-added .ok{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:#4caf50;color:#fff;font-size:32px;font-weight:900}.toast-added b{display:block;font-size:20px}.toast-added small{display:block;margin-top:6px;color:#756868}.toast-backdrop{position:fixed;inset:0;background:#0005;z-index:999;opacity:0;pointer-events:none;transition:.22s}.toast-backdrop.show{opacity:1}@media(max-width:850px){.page-layout{grid-template-columns:1fr}.sidecart{position:relative;top:auto;max-height:none;order:-1}}@media(max-width:760px){header{gap:10px;flex-wrap:wrap}.topnav{order:3;width:100%;justify-content:center}.topnav a{padding:8px 10px;font-size:14px}}
</style></head><body><div class="toast-backdrop" id="toastBackdrop"></div><div class="toast-added" id="toastAdded"><div class="ok">✓</div><b>Seu item foi adicionado!</b><small>Você pode escolher o próximo item.</small></div><header><nav class="topnav"><a href="index.html">🏠 Início</a><a href="sorvetes.html">🍦 Sorvetes</a><a href="acai.html">💜 Açaí</a><a href="crepes.html">🥞 Crepes</a><a class="active" href="bebidas.html">🥤 Bebidas</a><a href="pedido.html">🧾 Pedido</a><button class="clear-order-btn" onclick="limparPedidoGeral()">🗑️ Cancelar / Limpar pedido</button></nav><div class="brand"><img class="logo" src="logo.jpg" alt="Logo"> Bebidas</div></header><main><div class="page-layout"><div><section class="hero"><h1>🥤 Escolha sua Bebida</h1><p>Toque na bebida para adicionar ao pedido.</p><div class="grid" id="menuBebidas"></div></section></div><aside class="sidecart"><h2>🧾 Seu pedido</h2><div id="sideCards"></div><div class="sidetotal">Total: <span id="sideTotal">R$ 0,00</span></div></aside></div></main><button class="global-order-float" onclick="location.href='pedido.html'">🧾 Pedido geral<span id="globalBadge">0 item(ns) • R$ 0,00</span></button><script>
function itemAdicionado(voltar){let bg=document.getElementById('toastBackdrop'),t=document.getElementById('toastAdded');bg.classList.add('show');t.classList.add('show');setTimeout(()=>{bg.classList.remove('show');t.classList.remove('show');if(voltar){let el=document.querySelector(voltar);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}else window.scrollTo({top:0,behavior:'smooth'})},1100)}
function getPedido(){try{return JSON.parse(localStorage.getItem('pedidoGlobal')||'[]')}catch(e){return[]}}
function savePedido(p){localStorage.setItem('pedidoGlobal',JSON.stringify(p))}
async function carregarBebidas(){try{let txt=await fetch('bebidas.txt?v='+Date.now()).then(r=>r.text());let dados=txt.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#')).map(x=>{let [codigo,nome,preco]=x.split('|');return {codigo,nome,preco:Number(preco)}});menuBebidas.innerHTML='';dados.forEach(i=>{let b=document.createElement('button');b.className='drink';b.innerHTML='<b>🥤 '+i.nome+'</b><span>R$ '+i.preco.toFixed(2).replace('.',',')+'</span>';b.onclick=()=>adicionarBebida(i);menuBebidas.appendChild(b)})}catch(e){menuBebidas.innerHTML='<b>Não foi possível carregar bebidas.txt.</b>'}}
function adicionarBebida(i){let p=getPedido();p.push({categoria:'Bebida',nome:i.nome,detalhes:'',valor:i.preco,talher:'Não se aplica',consumo:'Não informado'});savePedido(p);renderSide();itemAdicionado('.hero')}
function renderSide(){let p=getPedido();sideCards.innerHTML=p.length?p.map((x,i)=>'<div class="sideitem"><div class="sideitem-top"><span>'+x.categoria+' • '+x.nome+'</span><span>R$ '+Number(x.valor).toFixed(2).replace('.',',')+'</span></div>'+(x.detalhes?'<small>'+x.detalhes+'</small>':'')+'<button onclick="removerGlobal('+i+')">Remover</button></div>').join(''):'<div class="sideempty">Nenhum item adicionado.</div>';let total=p.reduce((s,x)=>s+(Number(x.valor)||0),0);sideTotal.textContent='R$ '+total.toFixed(2).replace('.',',');globalBadge.textContent=p.length+' item(ns) • R$ '+total.toFixed(2).replace('.',',')}
function removerGlobal(i){let p=getPedido();p.splice(i,1);savePedido(p);renderSide()}
function limparPedidoGeral(){if(!confirm('Cancelar e limpar todo o pedido?'))return;localStorage.removeItem('pedidoGlobal');renderSide()}
carregarBebidas();renderSide();
</script></body></html>
