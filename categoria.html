<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f1;color:#382b2b}header{padding:18px 5%;background:#fff;display:flex;gap:16px;align-items:center;position:sticky;top:0;box-shadow:0 2px 14px #0002}.logo{height:58px}.back{font-weight:900;color:#392b2b;text-decoration:none}main{padding:28px 5% 110px;max-width:1200px;margin:auto}.hero{background:#fff;border-radius:22px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0002}.card h2{margin:0 0 8px}.price{font-size:21px;font-weight:900;color:#e84c78}.qty{display:flex;gap:8px;align-items:center;margin:12px 0}.qty button,.add{border:0;border-radius:10px;padding:10px 14px;font-weight:900}.add{background:#392b2b;color:#fff;width:100%}.cart{position:fixed;bottom:0;left:0;right:0;background:#392b2b;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.cart a{background:#f8c847;color:#382b2b;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:900}@media(min-width:601px) and (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><a class="back" href="index.html">← Início</a><img class="logo" src="logo.jpg"><b id="titulo">Cardápio</b></header>
<main><section class="hero"><h1 id="h1">Produtos</h1><p>Escolha os itens para adicionar ao pedido.</p></section><section class="grid" id="menu">Carregando...</section></main>
<div class="cart"><b id="badge">0 item(ns) • R$ 0,00</b><a href="pedido.html">Ver pedido →</a></div>
<script>
const SB='https://eaqdwplkxuxtipxljutd.supabase.co',KEY='sb_publishable_UOjScs_n5p7yKN8HLRx_2A_hxxAjAid',COD=new URLSearchParams(location.search).get('c')||'';
function pedido(){try{return JSON.parse(localStorage.getItem('pedidoGlobal')||'[]')}catch{return[]}}
function badge(){let p=pedido();document.getElementById('badge').textContent=p.length+' item(ns) • R$ '+p.reduce((s,x)=>s+Number(x.valor||0),0).toFixed(2).replace('.',',')}
async function carregar(){try{let rc=await fetch(SB+'/rest/v1/categorias?codigo=eq.'+encodeURIComponent(COD)+'&ativo=eq.true&select=id,nome,icone',{headers:{apikey:KEY}}),ca=await rc.json();if(!ca.length)throw Error('Categoria não encontrada');let c=ca[0];titulo.textContent=c.nome;h1.textContent=(c.icone||'')+' '+c.nome;let rp=await fetch(SB+'/rest/v1/produtos?categoria_id=eq.'+c.id+'&ativo=eq.true&select=id,codigo,nome,preco,observacao_preco,qtd_sabores,qtd_complementos_gratis,permite_complementos&order=ordem',{headers:{apikey:KEY}}),a=await rp.json();menu.innerHTML='';a.forEach(x=>{let e=document.createElement('article');e.className='card';let pr=Number(x.preco||0);e.innerHTML='<h2>'+x.nome+'</h2><div class="price">'+(x.observacao_preco||('R$ '+pr.toFixed(2).replace('.',',')))+'</div><div class="qty"><button class="menos">−</button><b class="n">1</b><button class="mais">+</button></div><button class="add">+ Adicionar</button>';let n=1;e.querySelector('.menos').onclick=()=>{n=Math.max(1,n-1);e.querySelector('.n').textContent=n};e.querySelector('.mais').onclick=()=>{n++;e.querySelector('.n').textContent=n};e.querySelector('.add').onclick=()=>{let p=pedido();for(let i=0;i<n;i++)p.push({categoria:c.nome,nome:x.nome,valor:pr,detalhes:'',talher:'Não informado',consumo:'Não informado',sabores:[],complementos:[]});localStorage.setItem('pedidoGlobal',JSON.stringify(p));n=1;e.querySelector('.n').textContent=1;badge()};menu.appendChild(e)});if(!a.length)menu.innerHTML='<div class="card">Nenhum produto cadastrado.</div>'}catch(e){menu.innerHTML='<div class="card"><b>'+e.message+'</b></div>'}}carregar();badge();
</script></body></html>
