<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f1;color:#382b2b}header{padding:18px 5%;background:#fff;display:flex;gap:16px;align-items:center;position:sticky;top:0;box-shadow:0 2px 14px #0002}.logo{height:58px}.back{font-weight:900;color:#392b2b;text-decoration:none}main{padding:28px 5% 110px;max-width:1200px;margin:auto}.hero{background:#fff;border-radius:22px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0002}.card h2{margin:0 0 8px}.price{font-size:21px;font-weight:900;color:#e84c78}.qty{display:flex;gap:8px;align-items:center;margin:12px 0}.qty button,.add{border:0;border-radius:10px;padding:10px 14px;font-weight:900}.add{background:#392b2b;color:#fff;width:100%}.cart{position:fixed;bottom:0;left:0;right:0;background:#392b2b;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.cart a{background:#f8c847;color:#382b2b;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:900}@media(min-width:601px) and (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}} .hidden{display:none}.pick{margin-top:12px;padding-top:12px;border-top:1px solid #eee}.choices{display:grid;gap:7px;margin-top:8px}.ch{background:#fff8f4;border:1px solid #eee;border-radius:9px;padding:8px}.q2{float:right;display:flex;gap:5px;align-items:center}.q2 button{border:0;border-radius:7px;padding:5px 9px;font-weight:900}</style></head><body>
<header><a class="back" href="index.html">← Início</a><img class="logo" src="logo.jpg"><b id="titulo">Cardápio</b></header>
<main><section class="hero"><h1 id="h1">Produtos</h1><p>Escolha os itens para adicionar ao pedido.</p></section><section class="hero"><h2>Como será o pedido?</h2><div style="display:flex;gap:18px;flex-wrap:wrap"><div><b>📍 Consumo:</b> <label><input type="radio" name="consumo" value="No local"> Consumir no local</label> <label><input type="radio" name="consumo" value="Viagem"> Viagem</label></div><div><b>🥄 Precisa de talher?</b> <label><input type="radio" name="talher" value="Sim"> Sim</label> <label><input type="radio" name="talher" value="Não"> Não</label></div></div></section><section class="grid" id="menu">Carregando...</section></main>
<div class="cart"><b id="badge">0 item(ns) • R$ 0,00</b><a href="pedido.html">Ver pedido →</a></div>
<script>
const SB='https://eaqdwplkxuxtipxljutd.supabase.co',KEY='sb_publishable_UOjScs_n5p7yKN8HLRx_2A_hxxAjAid',COD=new URLSearchParams(location.search).get('c')||'';
function pedido(){try{return JSON.parse(localStorage.getItem('pedidoGlobal')||'[]')}catch{return[]}}
function badge(){let p=pedido();document.getElementById('badge').textContent=p.length+' item(ns) • R$ '+p.reduce((s,x)=>s+Number(x.valor||0),0).toFixed(2).replace('.',',')}
let saboresDb=[],compsDb=[],regraExtra=4;
async function carregar(){try{let rc=await fetch(SB+'/rest/v1/categorias?codigo=eq.'+encodeURIComponent(COD)+'&ativo=eq.true&select=id,nome,icone',{headers:{apikey:KEY}}),ca=await rc.json();if(!ca.length)throw Error('Categoria não encontrada');let c=ca[0];titulo.textContent=c.nome;h1.textContent=(c.icone||'')+' '+c.nome;let [a,sab,com,cfg]=await Promise.all([fetch(SB+'/rest/v1/produtos?categoria_id=eq.'+c.id+'&ativo=eq.true&select=id,codigo,nome,preco,observacao_preco,qtd_sabores,qtd_complementos_gratis,permite_complementos&order=ordem',{headers:{apikey:KEY}}).then(r=>r.json()),fetch(SB+'/rest/v1/sabores?ativo=eq.true&select=codigo,nome&order=ordem',{headers:{apikey:KEY}}).then(r=>r.json()),fetch(SB+'/rest/v1/complementos?ativo=eq.true&select=codigo,nome,preco,limite_por_copo&order=ordem',{headers:{apikey:KEY}}).then(r=>r.json()),fetch(SB+'/rest/v1/configuracoes?chave=eq.valor_complemento_extra&select=valor',{headers:{apikey:KEY}}).then(r=>r.json())]);saboresDb=sab;compsDb=com;regraExtra=Number(cfg[0]?.valor||4);menu.innerHTML='';a.forEach(x=>montarCard(x,c));if(!a.length)menu.innerHTML='<div class="card">Nenhum produto cadastrado.</div>'}catch(e){menu.innerHTML='<div class="card"><b>'+e.message+'</b></div>'}}
function montarCard(x,c){let e=document.createElement('article');e.className='card';let pr=Number(x.preco||0),n=1,sq={},cq={};let especial=Number(x.qtd_sabores||1)>1||x.permite_complementos||COD==='BARCAS';e.innerHTML='<h2>'+x.nome+'</h2><div class="price">'+(x.observacao_preco||('R$ '+pr.toFixed(2).replace('.',',')))+'</div>'+(especial?'<div class="pick"><b>Sabores: '+Number(x.qtd_sabores||1)+'</b><div class="choices sabores"></div></div>':'<div class="qty"><button class="menos">−</button><b class="n">1</b><button class="mais">+</button></div>')+(x.permite_complementos?'<div class="pick"><b>Complementos grátis: '+Number(x.qtd_complementos_gratis||0)+'</b><div class="choices comps"></div></div>':'')+'<button class="add">+ Adicionar</button>';
if(!especial){e.querySelector('.menos').onclick=()=>{n=Math.max(1,n-1);e.querySelector('.n').textContent=n};e.querySelector('.mais').onclick=()=>{n++;e.querySelector('.n').textContent=n}}
if(especial){let box=e.querySelector('.sabores');box.innerHTML=saboresDb.map((s,i)=>'<div class="ch">'+s.nome+'<span class="q2"><button data-k="m" data-i="'+i+'">−</button><b data-n="'+i+'">0</b><button data-k="p" data-i="'+i+'">+</button></span></div>').join('');box.onclick=ev=>{let b=ev.target.closest('button');if(!b)return;let s=saboresDb[+b.dataset.i],tot=Object.values(sq).reduce((a,v)=>a+v,0),lim=Number(x.qtd_sabores||1);if(b.dataset.k==='p'&&tot<lim)sq[s.codigo]=(sq[s.codigo]||0)+1;if(b.dataset.k==='m')sq[s.codigo]=Math.max(0,(sq[s.codigo]||0)-1);box.querySelector('[data-n="'+b.dataset.i+'"]').textContent=sq[s.codigo]||0}}
if(x.permite_complementos){let box=e.querySelector('.comps');box.innerHTML=compsDb.map((s,i)=>'<div class="ch">'+s.nome+(s.preco!=null?' (+R$ '+Number(s.preco).toFixed(2).replace('.',',')+')':'')+'<span class="q2"><button data-k="m" data-i="'+i+'">−</button><b data-n="'+i+'">0</b><button data-k="p" data-i="'+i+'">+</button></span></div>').join('');box.onclick=ev=>{let b=ev.target.closest('button');if(!b)return;let s=compsDb[+b.dataset.i],at=cq[s.codigo]||0,lim=Number(s.limite_por_copo||0);if(b.dataset.k==='p'){if(lim&&at>=lim)return alert('Limite de '+lim+' para '+s.nome);cq[s.codigo]=at+1}else cq[s.codigo]=Math.max(0,at-1);box.querySelector('[data-n="'+b.dataset.i+'"]').textContent=cq[s.codigo]||0}}
e.querySelector('.add').onclick=()=>{let consumo=document.querySelector('input[name="consumo"]:checked')?.value,talher=document.querySelector('input[name="talher"]:checked')?.value;if(!consumo)return alert('Informe se é para consumir no local ou viagem.');if(!talher)return alert('Informe se precisa de talher.');let sab=[];saboresDb.forEach(s=>{for(let z=0;z<(sq[s.codigo]||0);z++)sab.push({codigo:s.codigo,nome:s.nome})});if(especial&&sab.length!==Number(x.qtd_sabores||1))return alert('Escolha '+Number(x.qtd_sabores||1)+' sabor(es).');let com=[],pad=0,fixo=0;compsDb.forEach(s=>{let q=cq[s.codigo]||0;for(let z=0;z<q;z++)com.push({codigo:s.codigo,nome:s.nome});if(s.preco==null)pad+=q;else fixo+=q*Number(s.preco)});let extra=Math.max(0,pad-Number(x.qtd_complementos_gratis||0))*regraExtra+fixo,valor=pr+extra,p=pedido(),det=sab.length?'Sabores: '+sab.map(z=>z.nome).join(' + '):'';if(com.length)det+=(det?' • ':'')+'Complementos: '+com.map(z=>z.nome).join(', ');let reps=especial?1:n;for(let z=0;z<reps;z++)p.push({categoria:c.nome,nome:x.nome,produto_codigo:x.codigo,valor,detalhes:det,talher,consumo,sabores:sab,complementos:com});localStorage.setItem('pedidoGlobal',JSON.stringify(p));badge();alert('Item adicionado!')};menu.appendChild(e)}
carregar();badge();
</script></body></html>
