<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crepes</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#382b2b;background:linear-gradient(#fff8f188,#fff8f1aa),url('fundo.jpg') center/cover fixed;min-height:100vh}header{padding:22px 5%;background:#ffffffed;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 14px #0002}.brand{font-size:30px;font-weight:900;color:#b96b2f;display:flex;align-items:center;gap:12px}.logo{height:62px;max-width:180px;object-fit:contain;border-radius:10px}.back{font-size:17px;text-decoration:none;color:#392b2b;font-weight:bold}main{padding:30px 5% 120px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:18px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 5px 18px #0002}.card h2{margin:0 0 10px}.add{width:100%;border:0;background:#b96b2f;color:#fff;padding:13px;border-radius:12px;font-weight:900;font-size:16px}.cart{position:fixed;bottom:0;left:0;right:0;background:#392b2b;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}.cart button{border:0;background:#f8c847;padding:13px 18px;border-radius:12px;font-weight:900}.hero{background:#ffffffdd;padding:28px;border-radius:24px}.hero h1{font-size:36px;margin:0 0 10px}</style></head><body><header><a class="back" href="index.html">← Início</a><div class="brand"><img class="logo" src="logo.jpg" alt="Logo"> Crepes</div></header><main><section class="hero"><h1>🥞 Escolha seu Crepe</h1><p>Toque em adicionar para colocar no mesmo pedido de Sorvetes e Açaí.</p></section><section class="grid" id="menuCrepes"></section></main><div class="cart"><div><b><span id="qtdCrepes">0</span> crepe(s) adicionado(s)</b><br><span id="totalCrepes">Total crepes: R$ 0,00</span></div><button onclick="location.href='pedido.html'">🧾 Ver pedido geral</button></div><script>
const sabores=['Queijo','Queijo com Presunto','Queijo com Calabresa','Queijo com Goiabada'];
let qtd=0,total=0;
sabores.forEach(nome=>{let e=document.createElement('article');e.className='card';e.innerHTML='<h2>🥞 '+nome+'</h2><p>Crepe de '+nome.toLowerCase()+'.</p><p><b>R$ 9,90</b></p><button class="add">+ Adicionar ao pedido</button>';e.querySelector('button').onclick=()=>{let p=JSON.parse(localStorage.getItem('pedidoGlobal')||'[]');p.push({categoria:'Crepe',nome:'Crepe '+nome,detalhes:'',valor:9.9});localStorage.setItem('pedidoGlobal',JSON.stringify(p));qtd++;total+=9.9;document.getElementById('qtdCrepes').textContent=qtd;document.getElementById('totalCrepes').textContent='Total crepes: R$ '+total.toFixed(2).replace('.',',');};menuCrepes.appendChild(e)});
</script></body></html>
