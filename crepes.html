<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crepes</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#382b2b;background:linear-gradient(#fff8f188,#fff8f1aa),url('fundo.jpg') center/cover fixed;min-height:100vh}header{padding:22px 5%;background:#ffffffed;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 14px #0002}.brand{font-size:30px;font-weight:900;color:#b96b2f;display:flex;align-items:center;gap:12px}.logo{height:62px;max-width:180px;object-fit:contain;border-radius:10px}.back{font-size:17px;text-decoration:none;color:#392b2b;font-weight:bold}main{padding:30px 5% 120px}.page-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}.page-content{min-width:0}.sidecart{position:sticky;top:115px;background:#ffffffee;border-radius:22px;padding:18px;box-shadow:0 8px 25px #0002;max-height:calc(100vh - 210px);overflow:auto}.sidecart h2{margin:0 0 12px;color:#7a3185}.sideitem{background:#f8f1f9;border:1px solid #eadcec;border-radius:14px;padding:12px;margin-bottom:10px}.sideitem-top{display:flex;justify-content:space-between;gap:8px;font-weight:900}.sideitem small{display:block;color:#756879;margin-top:5px;line-height:1.3}.sideitem button{border:0;background:#f3dddd;color:#8b3030;border-radius:8px;padding:6px 8px;margin-top:7px;font-weight:bold}.sideempty{color:#877989;padding:18px 4px;text-align:center}.sidetotal{border-top:2px solid #eadcec;margin-top:12px;padding-top:12px;font-size:19px;font-weight:900}@media(max-width:850px){.page-layout{grid-template-columns:1fr}.sidecart{position:relative;top:auto;max-height:none;order:-1}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:18px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 5px 18px #0002}.card h2{margin:0 0 10px}.add{width:100%;border:0;background:#b96b2f;color:#fff;padding:13px;border-radius:12px;font-weight:900;font-size:16px}.cart{position:fixed;bottom:0;left:0;right:0;background:#392b2b;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}.cart button{border:0;background:#f8c847;padding:13px 18px;border-radius:12px;font-weight:900}.hero{background:#ffffffdd;padding:28px;border-radius:24px}.hero h1{font-size:36px;margin:0 0 10px}.global-order-float{position:fixed;right:20px;bottom:90px;z-index:25;border:0;border-radius:18px;padding:13px 17px;background:#392b2b;color:#fff;font-weight:900;font-size:15px;box-shadow:0 5px 18px #0004;cursor:pointer}.global-order-float span{display:block;font-size:13px;margin-top:3px;color:#f8c847}</style></head><body><header><a class="back" href="index.html">← Início</a><div class="brand"><img class="logo" src="logo.jpg" alt="Logo"> Crepes</div></header><main><div class="page-layout"><div class="page-content"><section class="hero"><h1>🥞 Escolha seu Crepe</h1><p>Toque em adicionar para colocar no mesmo pedido de Sorvetes e Açaí.</p></section><section class="grid" id="menuCrepes"></section></div><aside class="sidecart"><h2>🧾 Seu pedido</h2><div id="sideCards"></div><div class="sidetotal">Total: <span id="sideTotal">R$ 0,00</span></div></aside></div></main><div class="cart"><div><b><span id="qtdCrepes">0</span> crepe(s) adicionado(s)</b><br><span id="totalCrepes">Total crepes: R$ 0,00</span></div><button onclick="location.href='pedido.html'">🧾 Ver pedido geral</button></div><script>
const sabores=['Queijo','Queijo com Presunto','Queijo com Calabresa','Queijo com Goiabada'];
let qtd=0,total=0;
sabores.forEach(nome=>{let e=document.createElement('article');e.className='card';e.innerHTML='<h2>🥞 '+nome+'</h2><p>Crepe de '+nome.toLowerCase()+'.</p><p><b>R$ 9,90</b></p><button class="add">+ Adicionar ao pedido</button>';e.querySelector('button').onclick=()=>{let p=JSON.parse(localStorage.getItem('pedidoGlobal')||'[]');p.push({categoria:'Crepe',nome:'Crepe '+nome,detalhes:'',valor:9.9});localStorage.setItem('pedidoGlobal',JSON.stringify(p));qtd++;renderSide();total+=9.9;document.getElementById('qtdCrepes').textContent=qtd;document.getElementById('totalCrepes').textContent='Total crepes: R$ '+total.toFixed(2).replace('.',',');};menuCrepes.appendChild(e)});
</script><button class="global-order-float" onclick="location.href='pedido.html'">🧾 Pedido geral<span id="globalBadge">0 item(ns) • R$ 0,00</span></button><script>(function(){function badge(){let p=[];try{p=JSON.parse(localStorage.getItem('pedidoGlobal')||'[]')}catch(e){}let total=p.reduce((s,x)=>s+(Number(x.valor)||0),0),e=document.getElementById('globalBadge');if(e)e.textContent=p.length+' item(ns) • R$ '+total.toFixed(2).replace('.',',')}badge();window.addEventListener('storage',badge)})();</script><script>function renderSide(){let p=[];try{p=JSON.parse(localStorage.getItem('pedidoGlobal')||'[]')}catch(e){};sideCards.innerHTML=p.length?p.map((x,i)=>'<div class="sideitem"><div class="sideitem-top"><span>'+x.categoria+' • '+x.nome+'</span><span>R$ '+Number(x.valor).toFixed(2).replace('.',',')+'</span></div>'+(x.detalhes?'<small>'+x.detalhes+'</small>':'')+'<button onclick="let p=JSON.parse(localStorage.getItem(\'pedidoGlobal\')||\'[]\');p.splice('+i+',1);localStorage.setItem(\'pedidoGlobal\',JSON.stringify(p));renderSide()">Remover</button></div>').join(''):'<div class="sideempty">Nenhum item adicionado.</div>';sideTotal.textContent='R$ '+p.reduce((s,x)=>s+(Number(x.valor)||0),0).toFixed(2).replace('.',',')}renderSide();</script></body></html>
