<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Totem</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#382b2b;background:linear-gradient(#fff8f188,#fff8f1aa),url('fundo.jpg') center/cover fixed;min-height:100vh}header{padding:22px 5%;background:#ffffffed;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px #0002}.brand{font-size:30px;font-weight:900;color:#e84c78;display:flex;align-items:center;gap:12px}.logo{height:62px;max-width:180px;object-fit:contain;border-radius:10px}.ticket-logo{display:block;max-width:150px;max-height:90px;object-fit:contain;margin:0 auto 14px}.back{font-size:17px;text-decoration:none;color:#392b2b;font-weight:bold}main{padding:30px 5% 120px}.hero{background:#ffffffdd;padding:26px;border-radius:24px;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#fff;border-radius:22px;padding:17px;box-shadow:0 6px 20px #0002}.pic{height:130px;border-radius:17px;background:#fff0e6;display:grid;place-items:center;font-size:64px}.card h2{margin:13px 0 5px}.desc{color:#756868;min-height:38px}.price{font-size:21px;font-weight:900;color:#e84c78}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.add{border:0;border-radius:50%;width:46px;height:46px;background:#392b2b;color:#fff;font-size:27px}.cart{position:fixed;bottom:0;left:0;right:0;background:#392b2b;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}.checkout{background:#f8c847;border:0;padding:14px 22px;border-radius:14px;font-weight:900;font-size:17px}.choice{min-height:310px;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:white;padding:28px;border-radius:28px;box-shadow:0 10px 30px #0003}.choice h2{font-size:36px;margin:0}.choice p{font-size:18px}.ice{background:linear-gradient(#0001,#0008),url('fundo.jpg') center/cover}.acai{background:linear-gradient(145deg,#54205fee,#8b3a91e8);position:relative;overflow:hidden}.acai-art{position:absolute;right:20px;top:22px;width:155px;height:155px;border-radius:50%;background:#fff3;display:grid;place-items:center;font-size:105px;filter:drop-shadow(0 8px 8px #32113b66);transform:rotate(-4deg)}.acai h2,.acai p{position:relative;z-index:2}.acai h2{max-width:55%}.crepe{background:linear-gradient(145deg,#b96b2fee,#e0a35cee);position:relative;overflow:hidden}.crepe-art{position:absolute;right:20px;top:22px;width:155px;height:155px;border-radius:50%;background:#fff3;display:grid;place-items:center;font-size:100px;filter:drop-shadow(0 8px 8px #5a2d1266);transform:rotate(5deg)}.crepe h2,.crepe p{position:relative;z-index:2}.crepe h2{max-width:55%}.check{display:flex;gap:10px;align-items:center;background:#fff;padding:14px;border-radius:15px;font-weight:bold}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.sizes{display:flex;gap:10px;flex-wrap:wrap}.size{padding:14px 18px;background:white;border:2px solid #eee;border-radius:15px;font-weight:bold}.size.active{border-color:#7a3185;background:#f3e5f5}</style></head><body><header><div class="brand"><img class="logo" src="logo.jpg" alt="Logo"> Sorvetes & Açaí</div><div>Autoatendimento</div></header><main><section class="hero"><h1>O que você deseja?</h1><p>Toque em uma opção para começar seu pedido.</p></section><section class="grid"><a class="choice ice" href="sorvetes.html"><h2>🍦 Sorvetes</h2><p>Escolha seus sabores favoritos →</p></a><a class="choice acai" href="acai.html"><div class="acai-art" aria-hidden="true">🥣</div><h2>💜 Açaí</h2><p>Escolha o tamanho e monte do seu jeito →</p></a><a class="choice crepe" href="crepes.html"><div class="crepe-art" aria-hidden="true">🥞</div><h2>Crepes</h2><p>Escolha seu crepe e os complementos →</p></a></section></main><div style="position:fixed;right:20px;bottom:20px;z-index:20"><button onclick="PedidoGlobal.go()" style="border:0;border-radius:18px;padding:15px 20px;background:#392b2b;color:#fff;font-weight:900;font-size:16px">🧾 Pedido geral<br><span id="globalBadge">0 item(ns) • R$ 0,00</span></button></div><script>window.PedidoGlobal={get(){try{return JSON.parse(localStorage.getItem('pedidoGlobal')||'[]')}catch(e){return[]}},save(x){localStorage.setItem('pedidoGlobal',JSON.stringify(x));this.badge()},add(x){let p=this.get();p.push(x);this.save(p)},total(){return this.get().reduce((s,x)=>s+(Number(x.valor)||0),0)},badge(){let e=document.getElementById('globalBadge'),p=this.get();if(e)e.textContent=p.length+' item(ns) • R$ '+this.total().toFixed(2).replace('.',',')},go(){location.href='pedido.html'}};addEventListener('DOMContentLoaded',()=>PedidoGlobal.badge());</script></body></html>
