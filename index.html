<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorvetes • Autoatendimento</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f1;color:#392b2b}
header{padding:28px 5%;background:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 14px #0001;position:sticky;top:0;z-index:5}
.brand{font-size:32px;font-weight:900}.brand span{color:#e84c78}.welcome{font-size:18px;color:#786969}
main{padding:30px 5% 120px}.hero{background:linear-gradient(120deg,#ffe3eb,#fff1c7);padding:30px;border-radius:26px;margin-bottom:25px}
.hero h1{font-size:36px;margin:0 0 8px}.hero p{font-size:19px;margin:0}
.tabs{display:flex;gap:12px;overflow:auto;padding:4px 0 22px}.tab{border:0;background:#fff;padding:14px 22px;border-radius:30px;font-size:17px;font-weight:700;box-shadow:0 3px 12px #0001;white-space:nowrap}.tab.active{background:#e84c78;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.card{background:white;border-radius:24px;padding:18px;box-shadow:0 6px 20px #55332212;cursor:pointer;transition:.15s}.card:active{transform:scale(.98)}
.pic{height:150px;border-radius:18px;display:grid;place-items:center;font-size:76px;background:#fff2e7}.card h2{margin:15px 0 6px;font-size:22px}.desc{height:42px;color:#817474}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:15px}.price{font-size:22px;font-weight:900;color:#e84c78}.add{width:48px;height:48px;border:0;border-radius:50%;background:#392b2b;color:white;font-size:28px}
.cart{position:fixed;bottom:0;left:0;right:0;background:#392b2b;color:white;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;z-index:10}.cart strong{font-size:20px}.checkout{border:0;background:#f8c847;padding:15px 24px;border-radius:16px;font-size:18px;font-weight:900}.badge{background:#e84c78;border-radius:50%;padding:5px 9px;margin-left:7px}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header><div class="brand">🍦 <span>Sorvetes</span></div><div class="welcome">Totem de autoatendimento</div></header>
<main>
<section class="hero"><h1>Qual vai ser o seu hoje? 😋</h1><p>Escolha seus sabores e monte seu pedido.</p></section>
<div class="tabs"><button class="tab active">Todos</button><button class="tab">Tradicionais</button><button class="tab">Especiais</button><button class="tab">Frutas</button><button class="tab">Picolés</button></div>
<section class="grid" id="menu"></section>
</main>
<div class="cart"><div><strong>Seu pedido <span class="badge" id="qty">0</span></strong><div id="total">Total: R$ 0,00</div></div><button class="checkout" onclick="alert('Próxima etapa: tela do carrinho')">Ver pedido →</button></div>
<script>
const items=[
['Chocolate','Cremoso e intenso','🍫',12.90],['Morango','Clássico com sabor de fruta','🍓',11.90],
['Baunilha','Leve, cremoso e aromático','🍦',10.90],['Pistache','Sabor especial e marcante','💚',15.90],
['Doce de Leite','Cremoso e irresistível','🍮',13.90],['Flocos','Creme com pedacinhos de chocolate','🍨',12.90],
['Maracujá','Refrescante e tropical','🥭',11.90],['Coco','Cremoso com sabor tropical','🥥',11.90]
];let qtd=0,total=0;
const menu=document.getElementById('menu');
items.forEach(i=>{const c=document.createElement('article');c.className='card';c.innerHTML='<div class="pic">'+i[2]+'</div><h2>'+i[0]+'</h2><div class="desc">'+i[1]+'</div><div class="bottom"><span class="price">R$ '+i[3].toFixed(2).replace('.',',')+'</span><button class="add">+</button></div>';c.onclick=()=>{qtd++;total+=i[3];document.getElementById('qty').textContent=qtd;document.getElementById('total').textContent='Total: R$ '+total.toFixed(2).replace('.',',')};menu.appendChild(c)});
</script></body></html>
