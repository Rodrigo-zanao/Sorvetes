<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido completo</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fff8f1;color:#382b2b}header{padding:18px 5%;background:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px #0002}.logo{height:58px}.back{text-decoration:none;color:#382b2b;font-weight:bold}main{max-width:900px;margin:auto;padding:28px 5% 120px}.item{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 3px 12px #0001;display:grid;grid-template-columns:1fr auto;gap:10px}.cat{font-size:13px;color:#8a718d;font-weight:bold;text-transform:uppercase}.nome{font-size:20px;font-weight:900}.det{color:#756868;margin-top:5px}.valor{font-weight:900}.remove{border:0;background:#f5dddd;color:#8c3030;padding:7px 10px;border-radius:9px;margin-top:8px}.empty{text-align:center;padding:50px;background:white;border-radius:20px}.totalbar{position:fixed;bottom:0;left:0;right:0;background:#392b2b;color:white;padding:15px 5%;display:flex;justify-content:center;gap:30px;align-items:center}.totalbar b{font-size:22px}.btn{border:0;background:#f8c847;padding:13px 18px;border-radius:12px;font-weight:900}@media print{header,.remove,.btn{display:none}.totalbar{position:static;background:white;color:black}}.clear-order-btn{border:0;background:#b83b3b;color:#fff;padding:10px 13px;border-radius:11px;font-weight:900;cursor:pointer}.clear-order-btn:hover{filter:brightness(.92)}
@page{size:80mm auto;margin:2mm}
#printCupom{display:none}
@media print{
 html,body{width:80mm!important;margin:0!important;padding:0!important;background:#fff!important;color:#000!important;font-family:Arial,sans-serif!important}
 body>*{display:none!important}
 #printCupom{display:block!important;width:76mm!important;margin:0!important;padding:0 1mm!important;font-size:12px!important;line-height:1.25!important}
 #printCupom *{box-sizing:border-box}
 .cupom-logo{display:block!important;max-width:34mm!important;max-height:18mm!important;object-fit:contain!important;margin:0 auto 2mm!important}
 .cupom-title{text-align:center!important;font-size:18px!important;font-weight:900!important;margin:1mm 0!important}
 .cupom-center{text-align:center!important}
 .cupom-sep{border-top:1px dashed #000!important;margin:2mm 0!important}
 .cupom-item{break-inside:avoid!important;margin:2mm 0!important}
 .cupom-item-top{display:flex!important;justify-content:space-between!important;gap:3mm!important;font-weight:900!important;font-size:13px!important}
 .cupom-cat{font-size:10px!important;font-weight:900!important;text-transform:uppercase!important}
 .cupom-det{font-size:11px!important;margin-top:1mm!important;white-space:pre-wrap!important}
 .cupom-total{display:flex!important;justify-content:space-between!important;font-size:17px!important;font-weight:900!important;margin-top:2mm!important}
 .cupom-rodape{text-align:center!important;font-size:10px!important;margin-top:3mm!important}
}
</style></head><body><header><a class="back" href="index.html">← Continuar comprando</a><img class="logo" src="logo.jpg"><b>Pedido completo</b><button class="clear-order-btn" onclick="limparPedidoGeral()">🗑️ Cancelar / Limpar pedido</button></header><main><h1>🧾 Seu pedido</h1><div id="lista"></div></main><section id="printCupom"></section><div class="totalbar"><span><span id="qtd">0</span> item(ns)</span><b id="valorTotal">R$ 0,00</b><button class="btn" onclick="window.print()">🖨️ Finalizar / Imprimir</button></div><script>window.PedidoGlobal={get(){try{return JSON.parse(localStorage.getItem('pedidoGlobal')||'[]')}catch(e){return[]}},save(x){localStorage.setItem('pedidoGlobal',JSON.stringify(x))},remove(i){let p=this.get();p.splice(i,1);this.save(p)},total(){return this.get().reduce((s,x)=>s+(Number(x.valor)||0),0)}};</script><script>function montarCupom(p){let total=p.reduce((s,x)=>s+(Number(x.valor)||0),0);let agora=new Date();document.getElementById('printCupom').innerHTML='<img class="cupom-logo" src="logo.jpg"><div class="cupom-title">PEDIDO</div><div class="cupom-center">'+agora.toLocaleDateString('pt-BR')+' '+agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div><div class="cupom-sep"></div>'+p.map((x,i)=>'<div class="cupom-item"><div class="cupom-cat">'+(i+1)+' - '+x.categoria+'</div><div class="cupom-item-top"><span>'+x.nome+'</span><span>R$ '+Number(x.valor).toFixed(2).replace('.',',')+'</span></div>'+(x.detalhes?'<div class="cupom-det">'+x.detalhes+'</div>':'')+'<div class="cupom-det"><b>Talher:</b> '+(x.talher||'Não informado')+' | <b>Consumo:</b> '+(x.consumo||'Não informado')+'</div>'+'</div><div class="cupom-sep"></div>').join('')+'<div class="cupom-total"><span>TOTAL</span><span>R$ '+total.toFixed(2).replace('.',',')+'</span></div><div class="cupom-sep"></div><div class="cupom-rodape">*** FIM DO PEDIDO ***</div>'}function render(){let p=PedidoGlobal.get();montarCupom(p);document.getElementById('qtd').textContent=p.length;document.getElementById('valorTotal').textContent='R$ '+PedidoGlobal.total().toFixed(2).replace('.',',');document.getElementById('lista').innerHTML=p.length?p.map((x,i)=>'<div class="item"><div><div class="cat">'+x.categoria+'</div><div class="nome">'+x.nome+'</div><div class="det">'+(x.detalhes||'')+'</div><div class="det"><b>🥄 Talher:</b> '+(x.talher||'Não informado')+' &nbsp; <b>📍 Consumo:</b> '+(x.consumo||'Não informado')+'</div><button class="remove" onclick="PedidoGlobal.remove('+i+');render()">Remover</button></div><div class="valor">R$ '+Number(x.valor).toFixed(2).replace('.',',')+'</div></div>').join(''):'<div class="empty"><h2>Seu pedido está vazio</h2><p>Volte ao menu e escolha Sorvetes, Açaí ou Crepes.</p></div>'}render()</script><script>function limparPedidoGeral(){if(!confirm('Cancelar e limpar todo o pedido?'))return;localStorage.removeItem('pedidoGlobal');try{if(typeof renderSide==='function')renderSide()}catch(e){}try{if(typeof renderGlobalSide==='function')renderGlobalSide()}catch(e){}try{if(typeof render==='function')render()}catch(e){}let b=document.getElementById('globalBadge');if(b)b.textContent='0 item(ns) • R$ 0,00';let sc=document.getElementById('sideCards');if(sc&&!window.renderSide&&!window.renderGlobalSide)sc.innerHTML='<div class="sideempty">Nenhum item adicionado.</div>';let st=document.getElementById('sideTotal');if(st)st.textContent='R$ 0,00';let q=document.getElementById('q');if(q)q.textContent='0';let t=document.getElementById('t');if(t)t.textContent='Total: R$ 0,00'}</script></body></html>
