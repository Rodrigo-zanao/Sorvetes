<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorvetes</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#382b2b;background:linear-gradient(#fff8f188,#fff8f1aa),url('fundo.jpg') center/cover fixed;min-height:100vh}header{padding:22px 5%;background:#ffffffed;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px #0002}.brand{font-size:30px;font-weight:900;color:#e84c78;display:flex;align-items:center;gap:12px}.logo{height:62px;max-width:180px;object-fit:contain;border-radius:10px}.ticket-logo{display:block;max-width:150px;max-height:90px;object-fit:contain;margin:0 auto 14px}.back{font-size:17px;text-decoration:none;color:#392b2b;font-weight:bold}main{padding:30px 5% 120px}.page-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}.page-content{min-width:0}.sidecart{position:sticky;top:115px;background:#ffffffee;border-radius:22px;padding:18px;box-shadow:0 8px 25px #0002;max-height:calc(100vh - 210px);overflow:auto}.sidecart h2{margin:0 0 12px;color:#7a3185}.sideitem{background:#f8f1f9;border:1px solid #eadcec;border-radius:14px;padding:12px;margin-bottom:10px}.sideitem-top{display:flex;justify-content:space-between;gap:8px;font-weight:900}.sideitem small{display:block;color:#756879;margin-top:5px;line-height:1.3}.sideitem button{border:0;background:#f3dddd;color:#8b3030;border-radius:8px;padding:6px 8px;margin-top:7px;font-weight:bold}.sideempty{color:#877989;padding:18px 4px;text-align:center}.sidetotal{border-top:2px solid #eadcec;margin-top:12px;padding-top:12px;font-size:19px;font-weight:900}@media(max-width:850px){.page-layout{grid-template-columns:1fr}.sidecart{position:relative;top:auto;max-height:none;order:-1}}.hero{background:#ffffffdd;padding:26px;border-radius:24px;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#fff;border-radius:22px;padding:17px;box-shadow:0 6px 20px #0002}.pic{height:130px;border-radius:17px;background:#fff0e6;display:grid;place-items:center;font-size:64px}.card h2{margin:13px 0 5px}.desc{color:#756868;min-height:38px}.price{font-size:21px;font-weight:900;color:#e84c78}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.add{border:0;border-radius:50%;width:46px;height:46px;background:#392b2b;color:#fff;font-size:27px}.cart{position:fixed;bottom:0;left:0;right:0;background:#392b2b;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}.checkout{background:#f8c847;border:0;padding:14px 22px;border-radius:14px;font-weight:900;font-size:17px}.choice{min-height:310px;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:white;padding:28px;border-radius:28px;box-shadow:0 10px 30px #0003}.choice h2{font-size:36px;margin:0}.choice p{font-size:18px}.ice{background:linear-gradient(#0001,#0008),url('fundo.jpg') center/cover}.acai{background:linear-gradient(145deg,#54205fdd,#8b3a91dd)}.check{display:flex;gap:10px;align-items:center;background:#fff;padding:14px;border-radius:15px;font-weight:bold}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.sizes{display:flex;gap:10px;flex-wrap:wrap}.size{padding:14px 18px;background:white;border:2px solid #eee;border-radius:15px;font-weight:bold}.size.active{border-color:#7a3185;background:#f3e5f5}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:30;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:white;width:min(520px,95vw);border-radius:24px;padding:26px;box-shadow:0 15px 50px #0005}.box h2{margin-top:0}.receipt{background:#fafafa;border:1px dashed #aaa;padding:18px;margin:15px 0;white-space:pre-line}.actions{display:flex;gap:10px}.actions button{flex:1;border:0;padding:15px;border-radius:14px;font-weight:bold;font-size:16px}.print{background:#f8c847}.cancel{background:#eee}@media print{body>*:not(.modal){display:none!important}.modal{position:static;display:block;background:white;padding:0}.box{box-shadow:none;width:100%;padding:0}.actions{display:none}}.global-order-float{position:fixed;right:20px;bottom:90px;z-index:25;border:0;border-radius:18px;padding:13px 17px;background:#392b2b;color:#fff;font-weight:900;font-size:15px;box-shadow:0 5px 18px #0004;cursor:pointer}.global-order-float span{display:block;font-size:13px;margin-top:3px;color:#f8c847}</style></head><body><header><a class="back" href="index.html">← Início</a><div class="brand"><img class="logo" src="logo.jpg" alt="Logo"> Sorvetes</div></header><main><div class="page-layout"><div class="page-content"><section class="hero"><h1>Escolha seu sabor</h1><p>Toque no + para adicionar ao pedido.</p></section><section class="grid" id="menu"></section></div><aside class="sidecart"><h2>🧾 Seu pedido</h2><div id="sideCards"></div><div class="sidetotal">Total: <span id="sideTotal">R$ 0,00</span></div></aside></div></main><div class="cart"><div><b>Pedido: <span id="q">0</span> itens</b><br><span id="t">Total: R$ 0,00</span></div><button class="checkout" onclick="abrirPedido()">Ver pedido →</button></div><div class="modal" id="modal"><div class="box"><img class="ticket-logo" src="logo.jpg" alt="Logo"><h2>🧾 Confirmar pedido</h2><div class="receipt" id="recibo"></div><div class="actions"><button class="cancel" onclick="modal.classList.remove('open')">Voltar</button><button class="print" onclick="location.href='pedido.html'">🧾 Ver pedido geral</button></div></div></div><script>const a=[['Chocolate','Cremoso e intenso','🍫',12.9],['Morango','Clássico e frutado','🍓',11.9],['Baunilha','Leve e aromático','🍦',10.9],['Pistache','Especial e marcante','💚',15.9],['Doce de Leite','Cremoso e irresistível','🍮',13.9],['Flocos','Creme com chocolate','🍨',12.9],['Maracujá','Refrescante e tropical','🥭',11.9],['Coco','Cremoso e tropical','🥥',11.9]];let q=0,t=0,selecionados=[];a.forEach(i=>{let e=document.createElement('article');e.className='card';e.innerHTML='<div class="pic">'+i[2]+'</div><h2>'+i[0]+'</h2><div class="desc">'+i[1]+'</div><div class="bottom"><span class="price">R$ '+i[3].toFixed(2).replace('.',',')+'</span><button class="add">+</button></div>';e.onclick=()=>{q++;t+=i[3];selecionados.push({categoria:'Sorvete',nome:i[0],detalhes:'',valor:i[3]});document.querySelector('#q').textContent=q;document.querySelector('#t').textContent='Total: R$ '+t.toFixed(2).replace('.',',')};menu.appendChild(e)});let pedidos=[];function abrirPedido(){let geral=JSON.parse(localStorage.getItem('pedidoGlobal')||'[]');geral.push(...selecionados);localStorage.setItem('pedidoGlobal',JSON.stringify(geral));selecionados=[];if(typeof renderSide==='function')renderSide();recibo.textContent='SORVETES\n------------------------\nItens: '+q+'\nTotal: R$ '+t.toFixed(2).replace('.',',')+'\n\nObrigado pelo pedido!';modal.classList.add('open')}</script><button class="global-order-float" onclick="location.href='pedido.html'">🧾 Pedido geral<span id="globalBadge">0 item(ns) • R$ 0,00</span></button><script>(function(){function badge(){let p=[];try{p=JSON.parse(localStorage.getItem('pedidoGlobal')||'[]')}catch(e){}let total=p.reduce((s,x)=>s+(Number(x.valor)||0),0),e=document.getElementById('globalBadge');if(e)e.textContent=p.length+' item(ns) • R$ '+total.toFixed(2).replace('.',',')}badge();window.addEventListener('storage',badge)})();</script><script>function renderSide(){let p=[];try{p=JSON.parse(localStorage.getItem('pedidoGlobal')||'[]')}catch(e){};sideCards.innerHTML=p.length?p.map((x,i)=>'<div class="sideitem"><div class="sideitem-top"><span>'+x.categoria+' • '+x.nome+'</span><span>R$ '+Number(x.valor).toFixed(2).replace('.',',')+'</span></div>'+(x.detalhes?'<small>'+x.detalhes+'</small>':'')+'<button onclick="let p=JSON.parse(localStorage.getItem(\'pedidoGlobal\')||\'[]\');p.splice('+i+',1);localStorage.setItem(\'pedidoGlobal\',JSON.stringify(p));renderSide()">Remover</button></div>').join(''):'<div class="sideempty">Nenhum item adicionado.</div>';sideTotal.textContent='R$ '+p.reduce((s,x)=>s+(Number(x.valor)||0),0).toFixed(2).replace('.',',')}renderSide();</script></body></html>
