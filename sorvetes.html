<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorvetes / Açaí</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#382b2b;background:#fff8f1}header{padding:18px 4%;background:#fff;display:flex;gap:15px;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px #0002}.logo{height:58px}.back{font-weight:900;text-decoration:none;color:#392b2b}main{padding:25px 4% 110px;max-width:1400px;margin:auto}.hero{background:#fff;padding:22px;border-radius:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.opt{background:#fff;border:2px solid #eee;border-radius:15px;padding:13px;text-align:left;font-weight:800;cursor:pointer}.opt.active{border-color:#e84c78;background:#fff0f4}.opt small{display:block;margin-top:5px;color:#756868}.qty{display:grid;grid-template-columns:34px 28px 34px;gap:4px;align-items:center;float:right}.qty button{height:32px;border:0;border-radius:8px;font-size:18px;font-weight:900}.qty b{text-align:center}.selected{border-color:#e84c78;background:#fff0f4}.summary{font-weight:900;background:#fff4d5;padding:14px;border-radius:12px;margin-top:12px}.obs{width:100%;min-height:75px;padding:12px;border:2px solid #eee;border-radius:12px}.add{width:100%;border:0;border-radius:14px;padding:16px;background:#392b2b;color:#fff;font-size:18px;font-weight:900}.cart{position:fixed;bottom:0;left:0;right:0;background:#392b2b;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.cart a{background:#f8c847;color:#382b2b;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:900}.hidden{display:none}@media(min-width:601px) and (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><a class="back" href="index.html">← Início</a><img class="logo" src="logo.jpg"><b>🍦 Sorvetes / Açaí</b></header><main>
<section class="hero"><h1>1. Escolha o produto</h1><div class="grid" id="produtos"></div></section>
<section class="hero"><h1>2. Escolha os sabores</h1><p id="msgSabores">Selecione um produto.</p><div class="grid" id="sabores"></div></section>
<section class="hero hidden" id="boxComp"><h1>3. Complementos</h1><p id="msgComp"></p><div class="grid" id="complementos"></div></section>
<section class="hero"><h1>4. Como será o pedido?</h1><div style="display:flex;gap:18px;flex-wrap:wrap"><div><b>📍 Consumo:</b><label><input type="radio" name="consumo" value="No local"> Consumir no local</label> <label><input type="radio" name="consumo" value="Viagem"> Viagem</label></div><div><b>🥄 Precisa de talher?</b><label><input type="radio" name="talher" value="Sim"> Sim</label> <label><input type="radio" name="talher" value="Não"> Não</label></div></div></section><section class="hero"><h1>5. Observações</h1><textarea class="obs" id="obs" maxlength="200" placeholder="Digite uma observação..."></textarea><div class="summary" id="resumo">Escolha um produto.</div></section>
<button class="add" onclick="adicionar()">+ Adicionar ao pedido</button>
</main><div class="cart"><b id="badge">0 item(ns) • R$ 0,00</b><a href="pedido.html">Ver pedido →</a></div>
<script>
const SB='https://eaqdwplkxuxtipxljutd.supabase.co',KEY='sb_publishable_UOjScs_n5p7yKN8HLRx_2A_hxxAjAid';
let listaProdutos=[],listaSabores=[],listaComp=[],produto=null,sq={},cq={},regraExtra=4;
const get=async p=>{let r=await fetch(SB+'/rest/v1/'+p,{headers:{apikey:KEY}});if(!r.ok)throw Error(await r.text());return r.json()};
function dinheiro(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',')}
function pedido(){try{return JSON.parse(localStorage.getItem('pedidoGlobal')||'[]')}catch{return[]}}
function badge(){let p=pedido();document.getElementById('badge').textContent=p.length+' item(ns) • '+dinheiro(p.reduce((s,x)=>s+Number(x.valor||0),0))}
async function init(){try{let ca=await get('categorias?codigo=eq.SORVETES&select=id');if(!ca.length)throw Error('Categoria não encontrada');[listaProdutos,listaSabores,listaComp]=await Promise.all([get('produtos?categoria_id=eq.'+ca[0].id+'&ativo=eq.true&select=id,codigo,nome,preco,qtd_sabores,qtd_complementos_gratis,permite_complementos,observacao_preco&order=ordem'),get('sabores?ativo=eq.true&select=codigo,nome&order=ordem'),get('complementos?categoria_id=eq.'+ca[0].id+'&ativo=eq.true&select=codigo,nome,preco,limite_por_copo&order=ordem')]);let cfg=await get('configuracoes?chave=eq.valor_complemento_extra&select=valor');regraExtra=Number(cfg[0]?.valor||4);renderProdutos();renderSabores();renderComp()}catch(e){produtos.innerHTML='<b>Erro: '+e.message+'</b>'}}init();badge();
function renderProdutos(){produtos.innerHTML=listaProdutos.map((x,i)=>'<button class="opt" data-i="'+i+'" onclick="selProduto('+i+')"><b>'+x.nome+'</b><small>'+(x.observacao_preco||dinheiro(x.preco))+' • '+Number(x.qtd_sabores||1)+' sabor(es)'+(x.permite_complementos?' • complementos':'')+'</small></button>').join('')}
function selProduto(i){produto=listaProdutos[i];sq={};cq={};document.querySelectorAll('#produtos .opt').forEach((e,n)=>e.classList.toggle('active',n===i));boxComp.classList.toggle('hidden',!produto.permite_complementos);renderSabores();renderComp();atualizar()}
function renderSabores(){sabores.innerHTML=listaSabores.map((x,i)=>'<div class="opt '+((sq[x.codigo]||0)>0?'selected':'')+'"><span>'+x.nome+'</span><span class="qty"><button onclick="mudarSabor('+i+',-1)">−</button><b>'+(sq[x.codigo]||0)+'</b><button onclick="mudarSabor('+i+',1)">+</button></span></div>').join('');msgSabores.textContent=produto?'Escolha '+Number(produto.qtd_sabores||1)+' sabor(es)/bola(s).':'Selecione um produto.'}
function mudarSabor(i,d){if(!produto)return;let x=listaSabores[i],total=Object.values(sq).reduce((a,b)=>a+b,0),lim=Number(produto.qtd_sabores||1);if(d>0&&total>=lim)return;sq[x.codigo]=Math.max(0,(sq[x.codigo]||0)+d);renderSabores();atualizar()}
function renderComp(){complementos.innerHTML=listaComp.map((x,i)=>'<div class="opt '+((cq[x.codigo]||0)>0?'selected':'')+'"><span>'+x.nome+(x.preco!=null?' • '+dinheiro(x.preco):'')+'</span><span class="qty"><button onclick="mudarComp('+i+',-1)">−</button><b>'+(cq[x.codigo]||0)+'</b><button onclick="mudarComp('+i+',1)">+</button></span></div>').join('');if(produto)msgComp.textContent=Number(produto.qtd_complementos_gratis||0)+' gratuito(s). Extra padrão: '+dinheiro(regraExtra)+'.'}
function mudarComp(i,d){if(!produto?.permite_complementos)return;let x=listaComp[i],at=cq[x.codigo]||0,lim=Number(x.limite_por_copo||0);if(d>0&&lim>0&&at>=lim){alert(x.nome+' permite no máximo '+lim+' medida(s) por copo.');return}cq[x.codigo]=Math.max(0,at+d);renderComp();atualizar()}
function calc(){if(!produto)return {valor:0,extra:0};let gratis=Number(produto.qtd_complementos_gratis||0),pad=[] ,fixo=0;listaComp.forEach(x=>{let q=cq[x.codigo]||0;if(x.preco==null){for(let i=0;i<q;i++)pad.push(x)}else fixo+=q*Number(x.preco)});let extra=Math.max(0,pad.length-gratis)*regraExtra+fixo;return {valor:Number(produto.preco||0)+extra,extra}}
function atualizar(){if(!produto){resumo.textContent='Escolha um produto.';return}let ns=Object.values(sq).reduce((a,b)=>a+b,0),nc=Object.values(cq).reduce((a,b)=>a+b,0),c=calc();resumo.textContent=produto.nome+' • Sabores '+ns+'/'+Number(produto.qtd_sabores||1)+(produto.permite_complementos?' • '+nc+' complemento(s)':'')+' • Total '+dinheiro(c.valor)}
function expand(lista,map){let a=[];lista.forEach(x=>{for(let i=0;i<(map[x.codigo]||0);i++)a.push({codigo:x.codigo,nome:x.nome})});return a}
function adicionar(){if(!produto)return alert('Escolha o produto.');let consumo=document.querySelector('input[name="consumo"]:checked')?.value,talher=document.querySelector('input[name="talher"]:checked')?.value;if(!consumo)return alert('Informe se é para consumir no local ou viagem.');if(!talher)return alert('Informe se precisa de talher.');let sab=expand(listaSabores,sq),lim=Number(produto.qtd_sabores||1);if(sab.length!==lim)return alert('Escolha '+lim+' sabor(es)/bola(s).');let com=produto.permite_complementos?expand(listaComp,cq):[],c=calc(),det='Sabores: '+sab.map(x=>x.nome).join(' + ');if(com.length)det+=' • Complementos: '+com.map(x=>x.nome).join(', ');if(obs.value.trim())det+=' • Obs.: '+obs.value.trim();let p=pedido();p.push({categoria:'Sorvetes / Açaí',nome:produto.nome,produto_codigo:produto.codigo,valor:c.valor,detalhes:det,talher,consumo,sabores:sab,complementos:com});localStorage.setItem('pedidoGlobal',JSON.stringify(p));sq={};cq={};obs.value='';renderSabores();renderComp();atualizar();badge();alert('Item adicionado ao pedido!')}
</script></body></html>
